.dm-ph h2{font-size:20px;font-weight:720;color:var(--navy2);margin-bottom:8px;}
.dm-ph p{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:18px;}
.dm-soon{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:var(--goldSoft);border:1px solid #E7D5A8;border-radius:999px;padding:3px 9px;margin-bottom:14px;}
.dm-steps{display:flex;flex-direction:column;gap:8px;text-align:left;}
.dm-step{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;}
.dm-step .sn{font-family:var(--mono);font-size:11px;color:#fff;background:var(--navy);width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;margin-top:1px;}
.dm-step b{font-size:12.5px;font-weight:620;color:var(--ink);}
.dm-step small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45;}
/* ===== \u2460 5\uB2E8 \uBD84\uD574 ===== */
.dm-dcases{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px;}
.dm-dcase{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-family:var(--sans);transition:border-color .15s,background .15s;}
.dm-dcase:hover{border-color:var(--navyLine);background:var(--surface2);}
.dm-dcase.on{border-color:var(--navy);background:var(--navySoft);}
.dm-dcase b{font-size:13px;font-weight:640;color:var(--ink);}
.dm-src{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 16px;margin-bottom:14px;flex-wrap:wrap;}
.dm-srcl{display:flex;align-items:center;gap:11px;}
.dm-srcdoc{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:var(--navy2);border-radius:6px;padding:5px 8px;letter-spacing:.05em;flex:none;}
.dm-srcl b{font-size:13px;font-weight:620;color:var(--navy2);display:block;line-height:1.35;}
.dm-srcl small{font-size:11px;color:var(--muted);}
.dm-srcr{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right;max-width:300px;line-height:1.5;}
.dm-pipe{display:flex;flex-direction:column;gap:9px;}
.dm-pstage{border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden;}
.dm-pstage.on{border-color:var(--navyLine);}
.dm-phead{width:100%;display:flex;align-items:center;gap:13px;padding:14px 16px;background:none;border:none;cursor:pointer;font-family:var(--sans);text-align:left;}
.dm-pstage.on .dm-phead{background:var(--navySoft);}
.dm-pno{font-family:var(--mono);font-size:13px;font-weight:700;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--paper);color:var(--muted);flex:none;}
.dm-pstage.on .dm-pno{background:var(--navy);color:#fff;}
.dm-pttl{flex:1;}
.dm-pttl b{font-size:14px;font-weight:640;color:var(--ink);}
.dm-pttl small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;}
.dm-pchev{color:var(--navy);font-size:13px;}
.dm-pbody{padding:15px 16px 16px;border-top:1px solid var(--line2);}
.dm-kv{display:flex;flex-direction:column;}
.dm-kvrow{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line2);}
.dm-kvrow:last-child{border-bottom:none;}
.dm-kvk{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:1px;}
.dm-kvv{font-size:12.5px;color:var(--ink2);line-height:1.5;}
.dm-irac{margin-top:12px;display:flex;flex-direction:column;gap:7px;}
.dm-iracrow{display:grid;grid-template-columns:84px 1fr;gap:11px;background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;}
.dm-iracrow.on{background:var(--sealSoft);border-color:#B9DECE;}
.dm-iraclab{font-family:var(--mono);font-size:10px;color:var(--navy);font-weight:600;padding-top:2px;}
.dm-iracrow.on .dm-iraclab{color:var(--seal);}
.dm-iracrow p{font-size:12px;color:var(--ink2);line-height:1.5;}
.dm-evlist{display:flex;flex-direction:column;gap:9px;}
.dm-ev{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--surface2);}
.dm-evh{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.dm-evf{font-size:11px;font-weight:680;color:var(--navy2);background:var(--navySoft);border:1px solid var(--navyLine);border-radius:6px;padding:2px 8px;}
.dm-evcid{font-family:var(--mono);font-size:10px;color:var(--seal);background:var(--sealSoft);border:1px solid #B9DECE;border-radius:5px;padding:2px 7px;}
.dm-evhd,.dm-evhd2{font-family:var(--mono);font-size:10px;color:var(--muted);}
.dm-evhd2{margin-top:5px;}
.dm-evq{font-size:12px;color:var(--ink);line-height:1.5;}
.dm-qa{display:flex;flex-direction:column;gap:11px;}
.dm-qatop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.dm-qachips{display:flex;gap:5px;}
.dm-qachip{font-size:11px;font-family:var(--sans);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;}
.dm-qachip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.dm-qatally{display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--ink2);font-weight:600;flex-wrap:wrap;}
.dm-qatally em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400;margin-right:4px;}
.dm-qarow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;}
.dm-qameta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.dm-qtier{margin-left:auto;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid;}
.dm-qq{font-size:13px;font-weight:620;color:var(--ink);line-height:1.45;}
.dm-qaA{font-size:12px;color:var(--ink2);line-height:1.55;white-space:pre-wrap;}
.dm-expand{font-family:var(--mono);font-size:10px;color:var(--navy);background:none;border:none;cursor:pointer;margin-left:6px;padding:0;text-decoration:underline;}
.dm-qfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-top:1px dashed var(--line2);padding-top:8px;}
.dm-qg{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;flex:1;}
.dm-send{font-size:11.5px;font-weight:620;color:var(--navy);background:var(--navySoft);border:1px solid var(--navyLine);border-radius:8px;padding:6px 11px;cursor:pointer;font-family:var(--sans);white-space:nowrap;flex:none;}
.dm-send:hover{background:var(--navy);color:#fff;}
.dm-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:6px;}
@media(max-width:760px){.dm-tiers{grid-template-columns:1fr;}}
.dm-tier{border:1px solid var(--navyLine);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px;background:var(--surface2);}
.dm-tierh{display:flex;align-items:baseline;gap:7px;}
.dm-tierh b{font-size:14px;font-weight:720;color:var(--navy2);}
.dm-tierh span{font-family:var(--mono);font-size:10px;color:var(--muted);}
.dm-tier p{font-size:11px;color:var(--ink2);line-height:1.5;flex:1;margin:0;}
.dm-tier button{font-family:var(--mono);font-size:11px;color:#fff;background:var(--navy);border:none;border-radius:9px;padding:9px;cursor:pointer;transition:background .15s;}
.dm-tier button:hover{background:var(--navy2);}
.dm-dlnote{font-size:11.5px;color:var(--seal);background:var(--sealSoft);border:1px solid #B9DECE;border-radius:9px;padding:9px 12px;}

/* ===== \uC2DC\uC5F0 \uC791\uC5C5\uB300 ===== */
.dm-shell{grid-template-columns:196px 1fr;}
.dm-main.studio{max-width:1180px;padding:34px 40px;}
@media(max-width:680px){.dm-main.studio{padding:22px 18px;}}

.st-h1{font-size:24px;font-weight:720;color:var(--navy2);margin:0 0 6px;letter-spacing:-0.02em;}
.st-sub{font-size:13px;color:var(--muted);margin:0 0 26px;}

/* \uC5C5\uB85C\uB4DC \uBC15\uC2A4 (\uAC00\uC7A5 \uD06C\uAC8C) */
.st-upload{border:2px dashed var(--navyLine);border-radius:18px;background:var(--navySoft);padding:44px 24px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.st-upload:hover{border-color:var(--navy);background:#E0E9F6;}
.st-upic{width:52px;height:52px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:24px;margin:0 auto 14px;}
.st-upload b{display:block;font-size:17px;color:var(--navy2);font-weight:680;}
.st-upload small{font-size:12px;color:var(--muted);font-family:var(--mono);}
.st-file{margin-top:14px;font-size:12.5px;color:var(--ink2);font-family:var(--mono);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 13px;display:inline-block;}
.st-file .ok{color:var(--seal);font-weight:640;}

.st-or{text-align:center;font-size:12px;color:var(--muted);margin:22px 0 12px;}

/* \uC0D8\uD50C */
.st-samples{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:680px){.st-samples{grid-template-columns:1fr;}}
.st-sample{text-align:left;border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:var(--surface);cursor:pointer;transition:border-color .15s;}
.st-sample:hover{border-color:var(--navyLine);}
.st-sample.on{border-color:var(--navy);background:var(--navySoft);box-shadow:0 0 0 1px var(--navy) inset;}
.st-sample b{display:block;font-size:14px;color:var(--navy2);font-weight:660;margin-bottom:3px;}
.st-sample span{font-size:11.5px;color:var(--muted);}

.st-note{font-size:11.5px;color:var(--gold);background:var(--goldSoft);border:1px solid #E7D5A8;border-radius:9px;padding:9px 13px;margin-top:14px;line-height:1.5;}

/* \uD575\uC2EC \uC2E4\uD589 \uBC84\uD2BC */
.st-run{display:block;width:100%;margin-top:24px;font-family:var(--sans);font-size:15px;font-weight:680;color:#fff;background:var(--navy);border:none;border-radius:13px;padding:16px;cursor:pointer;box-shadow:0 4px 14px rgba(15,42,82,.22);transition:background .15s;}
.st-run:hover:not(:disabled){background:var(--navy2);}
.st-run:disabled{opacity:.6;cursor:default;}

/* \uC9C4\uD589 \uC0C1\uD0DC */
.st-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:24px;}
@media(max-width:760px){.st-steps{grid-template-columns:1fr;}}
.st-step{border:1px solid var(--line);border-radius:12px;padding:14px 12px;background:var(--surface);text-align:center;transition:all .2s;}
.st-step.active{border-color:var(--navy);background:var(--navySoft);}
.st-step.done{border-color:#B9DECE;background:var(--sealSoft);}
.st-sno{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--paper);color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:700;margin-bottom:8px;}
.st-step.active .st-sno{background:var(--navy);color:#fff;}
.st-step.done .st-sno{background:var(--seal);color:#fff;}
.st-step b{display:block;font-size:12px;color:var(--ink);font-weight:620;margin-bottom:2px;}
.st-step small{font-size:10.5px;color:var(--muted);}
.st-step.active small{color:var(--navy);font-weight:600;}

/* \uACB0\uACFC \uBBF8\uB9AC\uBCF4\uAE30 */
.st-result{margin-top:24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;box-shadow:0 2px 10px rgba(15,42,82,.05);}
.st-rhead{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;background:var(--sealSoft);border-bottom:1px solid #C9E5D8;}
.st-rhead b{font-size:15px;color:var(--seal);font-weight:700;}
.st-rhead span{font-size:12px;color:var(--seal);font-family:var(--mono);}
.st-rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line2);}
@media(max-width:680px){.st-rgrid{grid-template-columns:repeat(2,1fr);}}
.st-rkv{background:var(--surface);padding:14px 16px;}
.st-rkv span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.st-rkv b{font-size:13.5px;color:var(--navy2);font-weight:660;}
.st-rev,.st-rqa{padding:14px 20px;border-top:1px solid var(--line2);}
.st-rev span,.st-rqa span{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.st-rev p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.55;}
.st-qa1{background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;}
.st-qa1 .q{font-size:12.5px;color:var(--navy2);font-weight:600;margin-bottom:6px;line-height:1.5;}
.st-qa1 .a{font-size:12px;color:var(--ink2);line-height:1.55;}
.st-next{margin:16px 20px 20px;font-family:var(--sans);font-size:13.5px;font-weight:660;color:#fff;background:var(--navy);border:none;border-radius:11px;padding:12px 22px;cursor:pointer;}
.st-next:hover{background:var(--navy2);}

/* \uAC80\uC99D */
.st-ta{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;resize:vertical;min-height:140px;}
.st-vbtns{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0;}
.st-vprimary{font-family:var(--sans);font-size:13.5px;font-weight:660;color:#fff;background:var(--navy);border:none;border-radius:11px;padding:12px 20px;cursor:pointer;}
.st-vprimary:hover{background:var(--navy2);}
.st-vghost{font-family:var(--sans);font-size:12.5px;color:var(--navy);background:var(--navySoft);border:1px solid var(--navyLine);border-radius:10px;padding:11px 16px;cursor:pointer;}
.st-verr{font-size:12px;color:var(--red);background:var(--redSoft);border:1px solid #E0BCB9;border-radius:9px;padding:10px 13px;margin-bottom:12px;}

.st-verdict{display:flex;align-items:center;gap:18px;border-radius:16px;padding:20px 24px;margin-top:8px;}
.st-verdict.ok{background:var(--sealSoft);border:1px solid #B9DECE;}
.st-verdict.rv{background:var(--goldSoft);border:1px solid #E7D5A8;}
.st-verdict.bad{background:var(--redSoft);border:1px solid #E0BCB9;}
.st-vbig{font-size:30px;font-weight:760;letter-spacing:-0.02em;}
.st-verdict.ok .st-vbig{color:var(--seal);}
.st-verdict.rv .st-vbig{color:var(--gold);}
.st-verdict.bad .st-vbig{color:var(--red);}
.st-vmeta{font-size:12.5px;color:var(--ink2);line-height:1.6;}
.st-vmeta b{font-family:var(--mono);}

.st-errlist{margin-top:18px;display:flex;flex-direction:column;gap:9px;}
.st-errrow{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:13px 16px;background:var(--surface);}
.st-errcode{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;}
.st-errcode.block{color:var(--red);background:var(--redSoft);}
.st-errcode.warn{color:var(--gold);background:var(--goldSoft);}
.st-errrow .loc{font-size:12.5px;color:var(--navy2);font-weight:620;}
.st-errrow .reco{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.5;}
.st-clean{margin-top:18px;font-size:13px;color:var(--seal);background:var(--sealSoft);border:1px solid #B9DECE;border-radius:12px;padding:14px 18px;font-weight:600;}

.st-codes{margin-top:26px;}
.st-codes .lbl{font-size:11px;color:var(--muted);margin-bottom:9px;font-weight:600;}
.st-codechips{display:flex;flex-wrap:wrap;gap:7px;}
.st-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;background:var(--surface2);font-size:11.5px;color:var(--ink2);}
.st-chip i{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;font-style:normal;}
.st-chip i.block{color:var(--red);background:var(--redSoft);}
.st-chip i.warn{color:var(--gold);background:var(--goldSoft);}

/* \uB2E4\uC6B4\uB85C\uB4DC */
.st-dls{display:flex;flex-direction:column;gap:11px;margin-top:8px;}
.st-dl{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:15px 18px;background:var(--surface);}
.st-dlinfo b{font-family:var(--mono);font-size:13.5px;color:var(--navy2);font-weight:680;}
.st-dlinfo p{margin:3px 0 0;font-size:12px;color:var(--muted);}
.st-dl button{font-family:var(--sans);font-size:12.5px;font-weight:620;color:#fff;background:var(--navy);border:none;border-radius:10px;padding:10px 18px;cursor:pointer;}
.st-dl button:hover{background:var(--navy2);}
.st-zip{display:block;width:100%;margin-top:18px;font-family:var(--sans);font-size:14px;font-weight:680;color:#fff;background:var(--seal);border:none;border-radius:13px;padding:15px;cursor:pointer;box-shadow:0 4px 14px rgba(12,115,85,.2);}
.st-zip:hover{background:#0A6249;}
.st-dlnote2{margin-top:12px;font-size:12px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:10px 14px;line-height:1.5;}
.st-upload.drag{border-color:var(--navy);background:#DCE7F6;box-shadow:0 0 0 3px rgba(23,60,110,.12);}
.st-dlrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2);}
.st-dllab{font-size:12px;font-weight:680;color:var(--ink2);margin-right:2px;}
.st-dlbtn{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--navy2);background:var(--navySoft);border:1px solid var(--navyLine);border-radius:8px;padding:7px 12px;cursor:pointer;}
.st-dlbtn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.st-vtable{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px;}
.st-vtable th,.st-vtable td{border:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:top;}
.st-vtable th{background:var(--surface2);color:var(--navy2);font-weight:680;white-space:nowrap;}
.st-vtable td.c{text-align:center;white-space:nowrap;}
.st-tg{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;}
.st-tg.ok{background:#DEF1EA;color:#0C7355;}
.st-tg.rv{background:#E7EDF6;color:#173C6E;}
.st-tg.bad{background:#F2E1DF;color:#A53E38;}
.st-sum{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;}
.st-sumcard{flex:1;min-width:90px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--surface2);}
.st-sumcard b{display:block;font-size:20px;font-weight:740;color:var(--navy2);}
.st-sumcard span{font-size:11px;color:var(--ink2);}
.st-fileup{border:2px dashed var(--navyLine);border-radius:14px;background:var(--surface2);padding:18px;text-align:center;cursor:pointer;margin-top:8px;font-size:13px;color:var(--ink2);}
.st-fileup:hover{border-color:var(--navy);}
.st-pers{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px;}
.st-perschip{font-size:12px;font-weight:600;color:var(--navy2);background:var(--navySoft);border:1px solid var(--navyLine);border-radius:999px;padding:5px 12px;}
