        "a": "\uACF5\uC815\uAC70\uB798\uC704\uC6D0\uD68C\uAC00 \uD55C\uAD6D\uACFC\uC218\uC885\uBB18\uD611\uD68C\uC5D0 \uC2DC\uC815\uBA85\uB839(\uC55E\uC73C\uB85C \uADF8\uB7F0 \uD589\uB3D9 \uD558\uC9C0 \uB9D0\uB77C\uB294 \uBA85\uB839)\uACFC \uACFC\uC9D5\uAE08(\uBC8C\uAE08 \uAC19\uC740 \uAC70\uC608\uC694) 1,800\uB9CC \uC6D0\uC744 \uBD80\uACFC\uD588\uC5B4\uC694. \uD611\uD68C\uAC00 7\uB144 \uB118\uAC8C \uB9E4\uB144 \uACFC\uC218\uBB18\uBAA9 \uAC00\uACA9\uC744 \uC9C1\uC811 \uC815\uD574\uC11C \uD68C\uC6D0\uC0AC\uB4E4\uC5D0\uAC8C \uBC30\uD3EC\uD55C \uAC8C \uBB38\uC81C\uAC00 \uB410\uC5B4\uC694.",
        "g": "\uACFC\uC9D5\uAE08\uC561 : 18,000,000\uC6D0 | \uACFC\uC218\uBB18\uBAA9 \uD310\uB9E4\uC2DC\uC7A5\uC5D0\uC11C \uBD80\uB2F9\uD558\uAC8C \uACBD\uC7C1\uC744 \uC81C\uD55C\uD558\uB294 \uD589\uC704\uB97C \uB2E4\uC2DC \uD558\uC5EC\uC11C\uB294 \uC544\uB2C8 \uB41C\uB2E4. | \uD53C\uC2EC\uC778\uC740 \uB2E4\uC74C \uAC01 \uD638\uC5D0 \uB530\uB77C \uACFC\uC9D5\uAE08\uC744 \uAD6D\uACE0\uC5D0 \uB0A9\uBD80\uD558\uC5EC\uC57C \uD55C\uB2E4. | \uB0A9\uBD80\uAE30\uD55C : \uACFC\uC9D5\uAE08 \uB0A9\uBD80\uACE0\uC9C0\uC11C\uC5D0 \uBA85\uC2DC\uB41C \uB0A9\uBD80\uAE30\uD55C(60\uC77C) \uC774\uB0B4 | \uD53C\uC2EC\uC778\uC774 \uC774\uB97C \uACB0\uC815\uD568\uC73C\uB85C\uC368 \uAD6C\uC131\uC0AC\uC5C5\uC790\uB85C \uD558\uC5EC\uAE08 \uACBD\uC7C1\uC744 \uD68C\uD53C\uD558\uB3C4\uB85D \uD55C \uC810, \uC804\uAD6D \uACFC\uC218\uBB18\uBAA9 \uC0AC\uC5C5\uC790\uC758 32%\uAC00 \uD53C\uC2EC\uC778\uC758 \uAD6C\uC131\uC0AC\uC5C5\u2026"
      },
      {
        "ID": "002",
        "persona": "\uC77C\uBC18\uAD6D\uBBFC",
        "qtype": "\uBC95\uB839\uC911\uC2EC",
        "diff": "\uAE30\uCD08",
        "q": "\uD611\uD68C\uAC00 \uAC00\uACA9\uC744 \uC815\uD55C \uAC8C \uC65C \uBD88\uBC95\uC778 \uAC70\uC608\uC694?",
        "a": "\uC6D0\uB798 \uAC01 \uBB18\uBAA9 \uD310\uB9E4 \uC5C5\uCCB4\uAC00 \uC2A4\uC2A4\uB85C \uAC00\uACA9\uC744 \uC815\uD574\uC57C \uD558\uB294\uB370, \uD611\uD68C\uAC00 \uB300\uC2E0 \uAC00\uACA9\uC744 \uACB0\uC815\uD574\uC11C \uB098\uB220\uC92C\uC5B4\uC694. \uADF8\uB7EC\uBA74 \uC5C5\uCCB4\uB4E4\uB07C\uB9AC \uAC00\uACA9 \uACBD\uC7C1\uC744 \uC548 \uD558\uAC8C \uB418\uACE0 \uC18C\uBE44\uC790\uB4E4\uC774 \uC190\uD574\uB97C \uBCFC \uC218 \uC788\uAC70\uB4E0\uC694. \uC774\uB7F0 \uD589\uB3D9\uC740 \uACF5\uC815\uAC70\uB798\uBC95(\uC2DC\uC7A5\uC5D0\uC11C \uC790\uC720\uB86D\uAC8C \uACBD\uC7C1\uD558\uB3C4\uB85D \uC815\uD55C \uBC95\uC774\uC5D0\uC694)\uC5D0\uC11C \uAE08\uC9C0\uD558\uACE0 \uC788\uC5B4\uC694.",
        "g": "\uBC95 \uC81C26\uC870 \uC81C1\uD56D \uC81C1\uD638\uC758 \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uAE08\uC9C0\uD589\uC704...\uC81C19\uC870 \uC81C1\uD56D \uC81C1\uD638\uC758 \uAC00\uACA9\uC744 \uACB0\uC815\xB7\uC720\uC9C0 \uB610\uB294 \uBCC0\uACBD\uD558\uB294 \uD589\uC704... | \uB3C5\uC810\uADDC\uC81C \uBC0F \uACF5\uC815\uAC70\uB798\uC5D0 \uAD00\uD55C \uBC95\uB960 \uC81C26\uC870\u3010\uC0AC\uC5C5\uC790\uB2E8\uCCB4\uC758 \uAE08\uC9C0\uD589\uC704\u3011 | '\uAC00\uACA9\uACB0\uC815\uD589\uC704'\uB294 \uCD5C\uC885\uAC70\uB798 \uAC00\uACA9\uC744 \uACB0\uC815\uD558\uB294 \uD589\uC704\uB294 \uBB3C\uB860 \uD3C9\uADE0\uAC00\uACA9, \uD45C\uC900\uAC00\uACA9, \uAE30\uC900\uAC00\uACA9...\uAD6C\uC131\uC0AC\uC5C5\uC790\uC5D0\uAC8C \uAC00\uACA9\uC124\uC815\uC758 \uAE30\uC900\uC744 \uC81C\uC2DC\uD558\uAC70\uB098... | \u2460 \uC0AC\uC5C5\uC790\uB2E8\uCCB4\uC758 \uC758\uC0AC\uC5D0 \uC758\uD55C \uAC00\uACA9\uACB0\uC815\uD589\uC704\uAC00\u2026"
      },
      {
        "ID": "023",
        "persona": "\uAE30\uC5C5 \uCEF4\uD50C\uB77C\uC774\uC5B8\uC2A4 \uB2F4\uB2F9\uC790",
        "qtype": "\uC720\uC0AC\uC0AC\uB840",
        "diff": "\uC2EC\uD654",
        "q": "\uC0AC\uC5C5\uC790\uB2E8\uCCB4\uC758 \uAC00\uACA9\uACB0\uC815 \uD589\uC704\uB85C \uC81C\uC7AC\uB41C \uC720\uC0AC \uC0AC\uB840\uC758 \uACF5\uD1B5 \uD328\uD134\uC744 \uC815\uB9AC\uD558\uC5EC, \uB2F9\uC0AC \uC18C\uC18D \uD611\uD68C \uD65C\uB3D9 \uC2DC \uC0AC\uC804 \uC608\uBC29\uC5D0 \uD65C\uC6A9\uD560 \uC218 \uC788\uB294 \uC2DC\uC0AC\uC810\uC740 \uBB34\uC5C7\uC785\uB2C8\uAE4C?",
        "a": "\uBCF8 \uC0AC\uAC74 \uBC0F \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uAC00\uACA9\uACB0\uC815 \uD589\uC704 \uAD00\uB828 \uACF5\uC815\uAC70\uB798 \uCC98\uBD84 \uC0AC\uB840\uB4E4\uC758 \uACF5\uD1B5 \uD328\uD134\uC740 \uB2E4\uC74C\uACFC \uAC19\uC2B5\uB2C8\uB2E4. \uCCAB\uC9F8, \uD611\uC815\uAC00\uACA9\uD45C\xB7\uAD8C\uACE0\uAC00\uACA9\xB7\uD45C\uC900\uB2E8\uAC00 \uB4F1 \uC5B4\uB5A4 \uBA85\uCE6D\uC774\uB4E0 \uAD6C\uC131\uC0AC\uC5C5\uC790\uC758 \uAC00\uACA9\uC124\uC815\uC5D0 \uAE30\uC900\uC744 \uC81C\uC2DC\uD558\uB294 \uBB38\uC11C\uB97C \uD611\uD68C\uAC00 \uC791\uC131\xB7\uBC30\uD3EC\uD558\uB294 \uD589\uC704\uAC00 \uD575\uC2EC \uC704\uBC18 \uC720\uD615\uC785\uB2C8\uB2E4. \uB458\uC9F8, \uD611\uD68C \uC774\uC0AC\uD68C\xB7\uCD1D\uD68C\xB7\uC2E4\uBB34\uC704\uC6D0\uD68C \uB4F1 \uACF5\uC2DD \uC758\uC0AC\uACB0\uC815 \uAE30\uAD6C\uB97C \uD1B5\uD574 \uAC00\uACA9 \uACB0\uC758\uAC00 \uC774\uB8E8\uC5B4\uC9C0\uB294 \uACBD\uC6B0 \uD589\uC704\uC758 \uBA85\uC2DC\uC131\uC774 \uB192\uC544 \uC704\uBC18 \uC778\uC815 \uAC00\uB2A5\uC131\uC774 \uCEE4\uC9D1\uB2C8\uB2E4. \uC14B\uC9F8, \uD574\uB2F9 \uD611\uD68C\uC758 \uC2DC\uC7A5 \uCEE4\uBC84\uB9AC\uC9C0(\uAD6C\uC131\uC0AC\uC5C5\uC790 \uBE44\uC911)\uAC00 \uB192\uC744\uC218\uB85D \uACBD\uC7C1\uC81C\uD55C \uD6A8\uACFC\uAC00 \uC778\uC815\uB418\uAE30 \uC27D\uC2B5\uB2C8\uB2E4. \uB2F9\uC0AC \uC608\uBC29 \uD3EC\uC778\uD2B8\uB85C\uB294, \uD611\uD68C \uD68C\uC758 \uC548\uAC74\uC5D0 \uAC00\uACA9\xB7\uC218\uC218\uB8CC\xB7\uC6D0\uAC00 \uAD00\uB828 \uD56D\uBAA9\uC774 \uD3EC\uD568\uB418\uBA74 \uBC95\uBB34\uD300 \uC0AC\uC804 \uAC80\uD1A0\uB97C \uC758\uBB34\uD654\uD558\uACE0, \uD611\uD68C\uB85C\uBD80\uD130 \uC218\uB839\uD55C \uAC00\uACA9 \uAD00\uB828 \uBB38\uC11C\uB294 \uC989\uC2DC \uD65C\uC6A9 \uC911\uB2E8 \uBC0F \uD3D0\uAE30 \uD504\uB85C\uC138\uC2A4\uB97C \uB0B4\uBD80\uD1B5\uC81C \uC808\uCC28\uC5D0 \uBA85\uC2DC\uD574\uC57C \uD569\uB2C8\uB2E4. \uD611\uD68C \uD0C8\uD1F4\xB7\uCC38\uC5EC \uC911\uB2E8\uB3C4 \uB9AC\uC2A4\uD06C \uCC28\uB2E8 \uC635\uC158\uC73C\uB85C \uAC80\uD1A0\uD560 \uD544\uC694\uAC00 \uC788\uC2B5\uB2C8\uB2E4.",
        "g": "\uAD6D\uB9BD\uC885\uC790\uC6D0\uC5D0 \uB4F1\uB85D\uB41C \uAD6D\uB0B4 \uACFC\uC218\uBB18\uBAA9 \uC0AC\uC5C5\uC790\uB294 352\uAC1C\uC0AC... | \uB9E4\uB144 5\u223C6\uC6D4\uACBD\uC5D0 \uC5F4\uB9AC\uB294 \uC815\uAE30 \uC774\uC0AC\uD68C\uC5D0\uC11C \uACFC\uC218\uBB18\uBAA9\uC758 \uAC00\uACA9\uC744 \uD611\uC758\xB7\uACB0\uC815\uD55C \uD6C4 \uD611\uC815\uAC00\uACA9\uC744 \uBC30\uD3EC\uD558\uACE0 \uD648\uD398\uC774\uC9C0\uC5D0 \uAC8C\uC2DC\uD558\uC600\uB2E4. | \uD53C\uC2EC\uC778\uC740 \uACFC\uC218\uC885\uC790\uC5C5 \uB4F1\uB85D\uC790 \uB610\uB294 \uC601\uB18D\uC870\uD569\uBC95\uC778\uB4E4\uC774 \uC124\uB9BD\uD55C \uC0AC\uC5C5\uC790\uB2E8\uCCB4\uC774\uB2E4. | 2013\uB144 10\uC6D4 \uD604\uC7AC \uAD6C\uC131\uC0AC\uC5C5\uC790 \uC218\uB294 112\uAC1C\uC0AC\uC774\uB2E4. | \uD53C\uC2EC\uC778\uC740 2006\uB144\uBD80\uD130 2013\uB144\uAE4C\uC9C0 \uB9E4\uB144 \uC815\uAE30 \uC774\uC0AC\uD68C\uB97C\u2026"
      },
      {
        "ID": "024",
        "persona": "\uAE30\uC5C5 \uCEF4\uD50C\uB77C\uC774\uC5B8\uC2A4 \uB2F4\uB2F9\uC790",
        "qtype": "\uD1B5\uACC4\uAE30\uBC18",
        "diff": "\uC2EC\uD654",
        "q": "\uBCF8 \uC0AC\uAC74\uC758 \uC704\uBC18 \uAE30\uAC04(\uC57D 7\uB144 3\uAC1C\uC6D4)\uACFC \uACFC\uC9D5\uAE08 1,800\uB9CC \uC6D0 \uC218\uC900\uC744 \uAC10\uC548\uD560 \uB54C, \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uAC00\uACA9\uACB0\uC815 \uC0AC\uAC74\uC758 \uACFC\uC9D5\uAE08 \uC0B0\uC815 \uAE30\uC900\uC744 \uC2E4\uBB34\uC801\uC73C\uB85C \uC5B4\uB5BB\uAC8C \uC774\uD574\uD574\uC57C \uD569\uB2C8\uAE4C?",
        "a": "\uBCF8 \uC0AC\uAC74\uC740 2006\uB144 8\uC6D4\uBD80\uD130 2013\uB144 11\uC6D4 20\uC77C\uAE4C\uC9C0 \uC57D 7\uB144 3\uAC1C\uC6D4\uAC04\uC758 \uC704\uBC18 \uD589\uC704\uC5D0 \uB300\uD574 \uACFC\uC9D5\uAE08 18,000,000\uC6D0\uC774 \uBD80\uACFC\uB41C \uC0AC\uAC74\uC785\uB2C8\uB2E4. \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uC0AC\uAC74\uC758 \uACFC\uC9D5\uAE08\uC740 \uC0AC\uC5C5\uC790 \uAC04 \uB2F4\uD569(\uC81C19\uC870)\uACFC \uB2EC\uB9AC, \uAD00\uB828 \uB9E4\uCD9C\uC561 \uAE30\uC900\uC774 \uC544\uB2CC \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uC790\uCCB4\uC758 \uC7AC\uC815 \uADDC\uBAA8 \uBC0F \uC704\uBC18 \uD589\uC704\uC758 \uC911\uB300\uC131\uC744 \uC885\uD569\uC801\uC73C\uB85C \uACE0\uB824\uD558\uC5EC \uC0B0\uC815\uB429\uB2C8\uB2E4. \uC2E4\uBB34\uC801\uC73C\uB85C \uC720\uC758\uD560 \uC810\uC740, \uC704\uBC18 \uAE30\uAC04\uC774 \uB9E4\uC6B0 \uAE38\uB354\uB77C\uB3C4 \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uC790\uCCB4\uC758 \uACFC\uC9D5\uAE08 \uC0C1\uD55C\uC774 \uB0AE\uAC8C \uC124\uC815\uB420 \uC218 \uC788\uC5B4 \uAE08\uC561 \uC790\uCCB4\uAC00 \uD06C\uC9C0 \uC54A\uC744 \uC218 \uC788\uB2E4\uB294 \uC810\uC785\uB2C8\uB2E4. \uADF8\uB7EC\uB098 \uACFC\uC9D5\uAE08 \uC561\uC218\uBCF4\uB2E4 \uC2DC\uC815\uBA85\uB839 \uBC0F \uACF5\uC815\uAC70\uB798\uC704\uC6D0\uD68C \uCC98\uBD84 \uC774\uB825\uC774 \uAE30\uC5C5 \uD3C9\uD310\xB7\uC785\uCC30 \uC790\uACA9\xB7\uD5A5\uD6C4 \uC870\uC0AC \uAE30\uC900\uC810\uC5D0 \uBBF8\uCE58\uB294 \uC2E4\uC9C8\uC801 \uB9AC\uC2A4\uD06C\uAC00 \uB354 \uD06C\uB2E4\uB294 \uC810\uC744 \uB0B4\uBD80 \uAD50\uC721 \uC2DC \uAC15\uC870\uD560 \uD544\uC694\uAC00 \uC788\uC2B5\uB2C8\uB2E4. \uB2F9\uC0AC \uC18C\uC18D \uD611\uD68C\uC758 \uC720\uC0AC \uD589\uC704 \uBC1C\uC0DD \uC2DC \uACFC\uC9D5\uAE08 \uC774\uC678\uC758 \uAC04\uC811 \uBE44\uC6A9(\uBC95\uBB34 \uB300\uC751 \uBE44\uC6A9\xB7\uD3C9\uD310 \uC190\uC2E4\xB7\uC7AC\uBC1C \uC870\uC0AC \uAC00\uB2A5\uC131)\uAE4C\uC9C0 \uD3EC\uD568\uD558\uC5EC \uB9AC\uC2A4\uD06C\uB97C \uC0B0\uC815\uD574\uC57C \uD569\uB2C8\uB2E4.",
        "g": "\uACFC\uC9D5\uAE08\uC561 : 18,000,000\uC6D0 | \uACFC\uC218\uBB18\uBAA9 \uD310\uB9E4\uC2DC\uC7A5\uC5D0\uC11C \uBD80\uB2F9\uD558\uAC8C \uACBD\uC7C1\uC744 \uC81C\uD55C\uD558\uB294 \uD589\uC704\uB97C \uB2E4\uC2DC \uD558\uC5EC\uC11C\uB294 \uC544\uB2C8 \uB41C\uB2E4. | \uD53C\uC2EC\uC778\uC740 \uB2E4\uC74C \uAC01 \uD638\uC5D0 \uB530\uB77C \uACFC\uC9D5\uAE08\uC744 \uAD6D\uACE0\uC5D0 \uB0A9\uBD80\uD558\uC5EC\uC57C \uD55C\uB2E4. | \uB0A9\uBD80\uAE30\uD55C : \uACFC\uC9D5\uAE08 \uB0A9\uBD80\uACE0\uC9C0\uC11C\uC5D0 \uBA85\uC2DC\uB41C \uB0A9\uBD80\uAE30\uD55C(60\uC77C) \uC774\uB0B4 | \uD53C\uC2EC\uC778\uC740 \uACFC\uC218\uC885\uC790\uC5C5 \uB4F1\uB85D\uC790 \uB610\uB294 \uC601\uB18D\uC870\uD569\uBC95\uC778\uB4E4\uC774 \uC124\uB9BD\uD55C \uC0AC\uC5C5\uC790\uB2E8\uCCB4\uC774\uB2E4. | 2013\uB144 10\uC6D4 \uD604\uC7AC \uAD6C\uC131\uC0AC\uC5C5\uC790 \uC218\uB294 112\uAC1C\u2026"
      },
      {

        "persona": "\uB17C\uBB38 \uC900\uBE44 \uD559\uC0DD",
        "qtype": "\uC2DC\uC7A5\uC601\uD5A5",
        "diff": "\uC804\uBB38\uAC00",
        "q": "\uD55C\uAD6D\uACFC\uC218\uC885\uBB18\uD611\uD68C \uC0AC\uAC74\uC774 \uACFC\uC218\uBB18\uBAA9 \uD310\uB9E4\uC2DC\uC7A5 \uBC0F \uB18D\uC5C5 \uAD00\uB828 \uC720\uD1B5 \uC2DC\uC7A5\uC5D0 \uBBF8\uCE5C \uC0B0\uC5C5\uC801\xB7\uC815\uCC45\uC801 \uD568\uC758\uC640, \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uAC00\uACA9\uACB0\uC815\uD589\uC704 \uADDC\uC81C\uC758 \uD6C4\uC18D \uC815\uCC45 \uACFC\uC81C\uB294 \uC5B4\uB5BB\uAC8C \uC815\uB9AC\uB420 \uC218 \uC788\uB294\uAC00?",
        "a": "\uBCF8 \uC0AC\uAC74\uC740 \uACF5\uC815\uAC70\uB798\uBC95 \uC81C26\uC870 \uC81C1\uD56D \uC81C1\uD638 \uC704\uBC18\uC774 \uACFC\uC218\uBB18\uBAA9 \uD310\uB9E4\uC2DC\uC7A5\uC5D0 \uBBF8\uCE5C \uAD6C\uC870\uC801 \uACBD\uC7C1 \uC65C\uACE1\uC744 \uC120\uB840\uB85C \uD655\uB9BD\uD55C \uC0AC\uAC74\uC73C\uB85C \uBD84\uC11D\uB41C\uB2E4. \uC0B0\uC5C5\uC801\xB7\uC815\uCC45\uC801 \uD568\uC758\uB294 \uB2E4\uC74C \uC138 \uCE21\uBA74\uC5D0\uC11C \uAC80\uD1A0\uB420 \uC218 \uC788\uB2E4.\n\n\uCCAB\uC9F8, \uC2DC\uC7A5 \uAD6C\uC870 \uCE21\uBA74\uC5D0\uC11C \uC804\uAD6D 352\uAC1C \uC0AC\uC5C5\uC790 \uC911 32%\uB97C \uD3EC\uAD04\uD558\uB294 \uB2E8\uCCB4\uAC00 7\uB144\uAC04 \uD611\uC815\uAC00\uACA9\uC744 \uBC30\uD3EC\uD55C \uACB0\uACFC, \uACFC\uC218\uBB18\uBAA9 \uAD6C\uC785 \uB18D\uAC00\uB294 \uC2DC\uC7A5 \uAC00\uACA9 \uD0D0\uC0C9 \uBE44\uC6A9\uC774 \uC0AC\uC2E4\uC0C1 \uBB34\uC758\uBBF8\uD574\uC9C0\uACE0 \uD611\uC815\uAC00\uACA9 \uC218\uC900\uC5D0\uC11C \uAC70\uB798\uAC00 \uC9D1\uC911\uB418\uB294 \uAC00\uACA9 \uACE0\uCC29 \uD604\uC0C1\uC774 \uD615\uC131\uB418\uC5C8\uC744 \uAC00\uB2A5\uC131\uC774 \uC2DC\uC0AC\uB41C\uB2E4. \uC774\uB294 \uC18C\uBE44\uC790(\uB18D\uAC00) \uD6C4\uC0DD \uAC10\uC18C\uB85C \uC774\uC5B4\uC9C0\uBA70, \uBB18\uBAA9 \uBE44\uC6A9 \uC0C1\uC2B9\uC774 \uACFC\uC218 \uC0DD\uC0B0 \uC6D0\uAC00 \u2192 \uC18C\uBE44\uC790 \uAC00\uACA9\uC5D0 \uC5F0\uC1C4\uC801\uC73C\uB85C \uC804\uAC00\uB420 \uC218 \uC788\uB2E4\uB294 \uC0B0\uC5C5\uC801 \uD568\uC758\uB97C \uAC16\uB294\uB2E4.\n\n\uB458\uC9F8, \uADDC\uC81C \uC2E4\uD6A8\uC131 \uCE21\uBA74\uC5D0\uC11C \uC2DC\uC815\uBA85\uB839\uACFC \uACFC\uC9D5\uAE08 1,800\uB9CC \uC6D0\uC774\uB77C\uB294 \uCC98\uBD84 \uC218\uC900\uC774 7\uB144\uAC04\uC758 \uAC00\uACA9 \uACE0\uCC29 \uD589\uC704\uC5D0 \uB300\uD55C \uCDA9\uBD84\uD55C \uC5B5\uC9C0\uB825\uC744 \uAC16\uB294\uC9C0\uC5D0 \uB300\uD55C \uBE44\uB840\uC131 \uD3C9\uAC00\uAC00 \uC694\uAD6C\uB41C\uB2E4. \uC704\uBC18 \uAE30\uAC04 \uB300\uBE44 \uB0AE\uC740 \uACFC\uC9D5\uAE08 \uC218\uC900\uC740 \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uC81C\uC7AC\uC758 \uAD6C\uC870\uC801 \uD55C\uACC4\uB97C \uB4DC\uB7EC\uB0B4\uBA70, \uC774\uB294 \uD5A5\uD6C4 \uB18D\uC5C5 \uAD00\uB828 \uC720\uD1B5 \uC2DC\uC7A5\uC5D0\uC11C \uC720\uC0AC \uD589\uC704\uC758 \uBC18\uBCF5 \uC5B5\uC81C \uD6A8\uACFC\uAC00 \uC81C\uD55C\uC801\uC77C \uC218 \uC788\uB2E4\uB294 \uC815\uCC45\uC801 \uC6B0\uB824\uB97C \uC2DC\uC0AC\uD55C\uB2E4.\n\n\uC14B\uC9F8, \uBE44\uAD50\uBC95\uC801 \uAD00\uC810\uC5D0\uC11C EU\uC758 \uD611\uD68C \uACB0\uC815(Association decision, TFEU \uC81C101\uC870)\uC5D0 \uB300\uD55C \uC81C\uC7AC\uB294 \uAD6C\uC131\uC0AC\uC5C5\uC790 \uB9E4\uCD9C\uC561 \uC5F0\uB3D9 \uBC29\uC2DD\uC73C\uB85C \uB354 \uB192\uC740 \uC5B5\uC9C0\uB825\uC744 \uD655\uBCF4\uD558\uACE0 \uC788\uC73C\uBA70, \uC774\uC640 \uBE44\uAD50\uD55C \uD55C\uAD6D \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uACFC\uC9D5\uAE08 \uC81C\uB3C4\uC758 \uAC1C\uC120 \uD544\uC694\uC131\uC774 \uAC80\uD1A0\uB420 \uC218 \uC788\uB2E4.\n\n\uD6C4\uC18D \uC5F0\uAD6C \uACFC\uC81C\uB85C\uB294 (i) \uACFC\uC218\uBB18\uBAA9 \uC2DC\uC7A5\uC5D0\uC11C \uBCF8 \uC0AC\uAC74 \uCC98\uBD84 \uC804\uD6C4 \uAC00\uACA9 \uBD84\uC0B0 \uBCC0\uD654 \uC2E4\uC99D \uBD84\uC11D, (ii) \uB18D\uC5C5 \uAD00\uB828 \uC720\uD1B5 \uC2DC\uC7A5\uC5D0\uC11C \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uC870\uC9C1\uD654\uC728\uACFC \uAC00\uACA9 \uACBD\uC7C1 \uAC15\uB3C4 \uAC04\uC758 \uAD00\uACC4 \uC5F0\uAD6C, (iii) \uD45C\uC900\uAC00\uACA9 \uACF5\uD45C\uC758 \uC790\uC728\uADDC\uC81C \uAE30\uB2A5\uACFC \uACBD\uC7C1 \uC81C\uD55C \uAC04 \uBC95\uC801 \uACBD\uACC4\uC5D0 \uAD00\uD55C \uBE44\uAD50\uBC95\uC801 \uC5F0\uAD6C\uAC00 \uC81C\uC2DC\uB41C\uB2E4.",
        "g": "\uD53C\uC2EC\uC778\uC740 2006\uB144\uBD80\uD130 2013\uB144\uAE4C\uC9C0 \uB9E4\uB144 \uC815\uAE30 \uC774\uC0AC\uD68C\uB97C \uAC1C\uCD5C\uD558\uC5EC \uACFC\uC218\uBB18\uBAA9\uC758 \uAC00\uACA9\uC744 \uACB0\uC815\uD55C \uD6C4 \uD611\uC815\uAC00\uACA9\uD45C\uB97C \uC81C\uC791\uD558\uC5EC \uAD6C\uC131\uC0AC\uC5C5\uC790\uB4E4\uC5D0\uAC8C \uBC30\uD3EC... | \uC804\uAD6D \uACFC\uC218\uBB18\uBAA9 \uC2DC\uC7A5\uC5D0\uC11C \uBD80\uB2F9\uD558\uAC8C \uACBD\uC7C1\uC744 \uC81C\uD55C\uD558\uB294 \uD589\uC704\uB85C \uC778\uC815\uB41C\uB2E4. | \uD53C\uC2EC\uC778\uC774 \uC774\uB97C \uACB0\uC815\uD568\uC73C\uB85C\uC368 \uAD6C\uC131\uC0AC\uC5C5\uC790\uB85C \uD558\uC5EC\uAE08 \uACBD\uC7C1\uC744 \uD68C\uD53C\uD558\uB3C4\uB85D \uD55C \uC810, \uC804\uAD6D \uACFC\uC218\uBB18\uBAA9 \uC0AC\uC5C5\uC790\uC758 32%\uAC00 \uD53C\uC2EC\uC778\uC758 \uAD6C\uC131\uC0AC\uC5C5\uC790\uC778 \uC810... | \uD53C\uC2EC\uC778\uC740 \uACFC\uC218\uC885\uC790\uC5C5\u2026"
      },
      {
        "ID": "042",
        "persona": "\uB17C\uBB38 \uC900\uBE44 \uD559\uC0DD",
        "qtype": "\uBC95\uB839\uC911\uC2EC",
        "diff": "\uC804\uBB38\uAC00",
        "q": "\uACF5\uC815\uAC70\uB798\uBC95 \uC81C26\uC870 \uC81C1\uD56D \uC81C1\uD638\uC0C1 \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uAC00\uACA9\uACB0\uC815\uD589\uC704\uC758 \uD310\uB2E8 \uC694\uAC74 3\uAC00\uC9C0\uB294 \uBCF8 \uC0AC\uAC74\uC5D0\uC11C \uC5B4\uB5BB\uAC8C \uCDA9\uC871\uB418\uC5C8\uC73C\uBA70, \uC774 \uD310\uB2E8 \uAD6C\uC870\uAC00 \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uADDC\uC81C \uBC95\uB9AC\uC5D0 \uAC16\uB294 \uC120\uB840\uC801 \uC758\uBBF8\uC640 \uD6C4\uC18D \uC5F0\uAD6C \uACFC\uC81C\uB294 \uBB34\uC5C7\uC778\uAC00?",
        "a": "\uACF5\uC815\uAC70\uB798\uBC95 \uC81C26\uC870 \uC81C1\uD56D \uC81C1\uD638\uB294 \uC0AC\uC5C5\uC790\uB2E8\uCCB4\uAC00 \uC81C19\uC870 \uC81C1\uD56D \uC81C1\uD638(\uAC00\uACA9\uC744 \uACB0\uC815\xB7\uC720\uC9C0 \uB610\uB294 \uBCC0\uACBD\uD558\uB294 \uD589\uC704)\uC5D0 \uC758\uD558\uC5EC \uBD80\uB2F9\uD558\uAC8C \uACBD\uC7C1\uC744 \uC81C\uD55C\uD558\uB294 \uD589\uC704\uB97C \uAE08\uC9C0\uD55C\uB2E4. \uBCF8 \uC0AC\uAC74\uC5D0\uC11C 3\uC694\uAC74 \uCDA9\uC871 \uAD6C\uC870\uB294 \uB2E4\uC74C\uACFC \uAC19\uC774 \uBD84\uC11D\uB41C\uB2E4.\n\n\uC694\uAC74 \u2460 '\uB2E8\uCCB4 \uC758\uC0AC\uC5D0 \uC758\uD55C \uAC00\uACA9\uACB0\uC815\uD589\uC704 \uC874\uC7AC \uBC0F \uD45C\uC2DC'\uB294 \uD53C\uC2EC\uC778\uC774 2006\uB144\uBD80\uD130 2013\uB144\uAE4C\uC9C0 \uB9E4\uB144 \uC815\uAE30 \uC774\uC0AC\uD68C\uC5D0\uC11C \uD611\uC815\uAC00\uACA9\uC744 \uACB0\uC815\uD558\uACE0 \uD611\uC815\uAC00\uACA9\uD45C\uB97C \uC81C\uC791\uD558\uC5EC \uAD6C\uC131\uC0AC\uC5C5\uC790 112\uAC1C\uC0AC\uC5D0 \uBC30\uD3EC\xB7\uD648\uD398\uC774\uC9C0 \uAC8C\uC2DC\uD55C \uC0AC\uC2E4\uC5D0 \uC758\uD574 \uCDA9\uC871\uB418\uC5C8\uB2E4. \uACF5\uC815\uC704\uB294 '\uCD5C\uC885\uAC70\uB798 \uAC00\uACA9 \uACB0\uC815'\uBFD0 \uC544\uB2C8\uB77C '\uD3C9\uADE0\uAC00\uACA9\xB7\uD45C\uC900\uAC00\uACA9\xB7\uAE30\uC900\uAC00\uACA9 \uC81C\uC2DC' \uD589\uC704\uB3C4 \uAC00\uACA9\uACB0\uC815\uD589\uC704\uC5D0 \uD3EC\uD568\uB428\uC744 \uBA85\uC2DC\uD558\uC600\uB294\uB370, \uC774\uB294 \uD615\uC2DD\uC801 \uAC15\uC81C\uB825 \uC5C6\uC774 \uC0AC\uC2E4\uC0C1 \uAC00\uACA9 \uAE30\uC900\uC744 \uC81C\uC2DC\uD558\uB294 \uD589\uC704\uC5D0\uB3C4 \uC694\uAC74 \u2460\uC774 \uCDA9\uC871\uB420 \uC218 \uC788\uC74C\uC744 \uC120\uB840\uB85C \uD655\uB9BD\uD55C \uC810\uC5D0\uC11C \uBC95\uB9AC\uC801 \uC758\uC758\uAC00 \uC778\uC815\uB41C\uB2E4.\n\n\uC694\uAC74 \u2461 '\uAD6C\uC131\uC0AC\uC5C5\uC790\uC758 \uAC00\uACA9\uACB0\uC815\uC5D0 \uC2E4\uC9C8\uC801 \uC601\uD5A5'\uC740 \uD611\uC815\uAC00\uACA9\uD45C \uBC30\uD3EC\xB7\uAC8C\uC2DC\uB85C \uAD6C\uC131\uC0AC\uC5C5\uC790\uC758 \uACBD\uC7C1 \uD68C\uD53C \uC720\uC778\uC774 \uAD6C\uC870\uC801\uC73C\uB85C \uD615\uC131\uB418\uC5C8\uB2E4\uB294 \uCD94\uB860\uC5D0 \uC758\uD574 \uC778\uC815\uB41C\uB2E4. \uC774 \uC9C0\uC810\uC5D0\uC11C '\uC2E4\uC9C8\uC801 \uC601\uD5A5'\uC758 \uC99D\uBA85 \uAE30\uC900 \u2014 \uD604\uC2E4 \uC900\uC218\uC728\xB7\uAC00\uACA9 \uC77C\uCE58 \uC99D\uAC70 \uC5C6\uC774\uB3C4 \uBC30\uD3EC\xB7\uAC8C\uC2DC\uB9CC\uC73C\uB85C \uCDA9\uC871 \uAC00\uB2A5\uD55C\uC9C0 \u2014 \uC774 \uB17C\uBB38 \uC8FC\uC81C\uB85C \uAC80\uD1A0\uB420 \uC218 \uC788\uB2E4.\n\n\uC694\uAC74 \u2462 '\uC77C\uC815 \uAC70\uB798\uBD84\uC57C\uC5D0\uC11C\uC758 \uBD80\uB2F9\uD55C \uACBD\uC7C1 \uC81C\uD55C'\uC740 \uC804\uAD6D \uACFC\uC218\uBB18\uBAA9 \uC0AC\uC5C5\uC790\uC758 32% \uC810\uC720\uB77C\uB294 \uC218\uCE58 \uADFC\uAC70\uB85C \uC778\uC815\uB418\uC5C8\uB2E4. \uD6C4\uC18D \uC5F0\uAD6C \uACFC\uC81C\uB85C\uB294 (i) \uC0AC\uC5C5\uC790\uB2E8\uCCB4 \uAC00\uACA9\uACB0\uC815\uD589\uC704\uC5D0\uC11C '\uC601\uD5A5\uC758 \uC2E4\uC9C8\uC131' \uD310\uB2E8 \uAE30\uC900\uC758 \uC120\uB840 \uB204\uC801 \uBD84\uC11D, (ii) 32%\uB77C\uB294 \uC2DC\uC7A5 \uC810\uC720 \uC784\uACC4\uAC12\uC758 \uACBD\uC7C1 \uC81C\uD55C\uC131 \uD310\uB2E8 \uC801\uC815\uC131\uC5D0 \uB300\uD55C \uBE44\uAD50\uBC95\uC801 \uAC80\uD1A0(EU\xB7\uBBF8\uAD6D \uAE30\uC900\uACFC \uBE44\uAD50), (iii) \uC790\uC728\uADDC\uC81C \uBAA9\uC801\uC758 \uD45C\uC900\uAC00\uACA9 \uC81C\uACF5\uACFC \uC704\uBC95\uD55C \uD611\uC815\uAC00\uACA9 \uACB0\uC815 \uAC04 \uBC95\uB9AC\uC801 \uACBD\uACC4 \uC124\uC815 \uC5F0\uAD6C\uAC00 \uC81C\uC2DC\uB41C\uB2E4.",
        "g": "'\uAC00\uACA9\uACB0\uC815\uD589\uC704'\uB294 \uCD5C\uC885\uAC70\uB798 \uAC00\uACA9\uC744 \uACB0\uC815\uD558\uB294 \uD589\uC704\uB294 \uBB3C\uB860 \uD3C9\uADE0\uAC00\uACA9, \uD45C\uC900\uAC00\uACA9, \uAE30\uC900\uAC00\uACA9...\uAD6C\uC131\uC0AC\uC5C5\uC790\uC5D0\uAC8C \uAC00\uACA9\uC124\uC815\uC758 \uAE30\uC900\uC744 \uC81C\uC2DC\uD558\uAC70\uB098... | \u2460 \uC0AC\uC5C5\uC790\uB2E8\uCCB4\uC758 \uC758\uC0AC\uC5D0 \uC758\uD55C \uAC00\uACA9\uACB0\uC815\uD589\uC704\uAC00 \uC874\uC7AC\uD558\uACE0...\u2461 \uAD6C\uC131\uC0AC\uC5C5\uC790\uC758 \uAC00\uACA9\uACB0\uC815\uC5D0 \uC601\uD5A5\uC744 \uBBF8\uCE58\uACE0, \u2462 \uACBD\uC7C1\uC744 \uBD80\uB2F9\uD558\uAC8C \uC81C\uD55C\uD558\uC5EC\uC57C \uD55C\uB2E4. | \uB3C5\uC810\uADDC\uC81C \uBC0F \uACF5\uC815\uAC70\uB798\uC5D0 \uAD00\uD55C \uBC95\uB960 \uC81C26\uC870\u3010\uC0AC\uC5C5\uC790\uB2E8\uCCB4\uC758 \uAE08\uC9C0\uD589\uC704\u3011 | \uBC95 \uC81C26\uC870 \uC81C1\uD56D \uC81C1\uD638\u2026"
      }

      "\uB2F9\uC0AC\uC790": "\uC77C\uC9C4\uC804\uAE30(\uD53C\uC2EC\uC778); \uD6A8\uC131\uAD7F\uC2A4\uD504\uB9C1\uC2A4(\uD53C\uC2EC\uC778); \uC2E0\uC2E0\uAE30\uACC4(\uD53C\uC2EC\uC778); \uCCAD\uC6B0\uD558\uC774\uB4DC\uB85C(\uD53C\uC2EC\uC778); \uC2E0\uC6B0\uC911\uACF5\uC5C5(\uD53C\uC2EC\uC778); \uB300\uC131\uD38C\uD504\uACF5\uC5C5(\uD53C\uC2EC\uC778); \uB3D9\uBA85\uC911\uACF5\uC5C5(\uD53C\uC2EC\uC778); \uAE40\u3147\u3147(\uB300\uD55C\uC911\uC804\uAE30\uC81C\uC791\uC18C, \uD53C\uC2EC\uC778); \uAE08\uC804\uAE30\uC5C5(\uD53C\uC2EC\uC778); \uB3D9\uD574\uC5D4\uC9C0\uB2C8\uC5B4\uB9C1(\uD53C\uC2EC\uC778); \uC870\uB2EC\uCCAD \uBC0F \uC218\uC694 \uACF5\uACF5\uAE30\uAD00(\uD53C\uD574\uC790)",
      "\uAE30\uAC04": "2004.12.23~2009.5.24",
      "\uD589\uC704": "\uC785\uCD95\uD38C\uD504 \uAD6C\uB9E4\uC785\uCC30 \uB099\uCC30\uC790\xB7\uD22C\uCC30\uAC00\uACA9 \uC0AC\uC804 \uACB0\uC815 \uBC0F \uC785\uCC30\uBB3C\uB7C9 \uBC30\uBD84",
      "\uD53C\uD574\uADDC\uBAA8": "\uAD00\uB828\uB9E4\uCD9C\uC561 529\uC5B5 4,351\uB9CC \uC6D0, \uACFC\uC9D5\uAE08 22\uC5B5 4,500\uB9CC \uC6D0",
      "\uD53C\uD574\uBC94\uC704": "\uC870\uB2EC\uCCAD \uBC1C\uC8FC \uC785\uCC30 39\uAC74\xB7\uC785\uCD95\uD38C\uD504 \uC2DC\uC7A5 \uAC70\uC758 100% \uC810\uC720 [\uB2F4\uD569]",
      "\uC694\uC57D": "\uC870\uB2EC\uCCAD \uBC1C\uC8FC \uC785\uCD95\uD38C\uD504 \uAD6C\uB9E4\uC785\uCC30\uC5D0\uC11C 10\uAC1C \uD38C\uD504 \uC81C\uC870\uC0AC\uAC00 4\uB144 5\uAC1C\uC6D4\uAC04 \uC0AC\uC804\uC5D0 \uB099\uCC30\uC790\xB7\uD22C\uCC30\uAC00\uACA9\uC744 \uC9DC\uACE0 39\uAC74 \uC785\uCC30\uBB3C\uB7C9\uC744 \uB098\uB220 \uBA39\uC740 \uB2F4\uD569 \uC0AC\uAC74. \uC2DC\uC815\uBA85\uB839 + \uACFC\uC9D5\uAE08 \uCD1D 22\uC5B5 4,500\uB9CC \uC6D0 \uBD80\uACFC."
    },
    "legal": {
      "\uC138\uBD84\uB958": "\uAD00\uAE09 \uC785\uCC30\uB2F4\uD569 (\uB099\uCC30\uC790\xB7\uD22C\uCC30\uAC00\uACA9 \uC0AC\uC804\uACB0\uC815 \uBC0F \uBB3C\uB7C9\uBC30\uBD84)",
      "\uC704\uBC18\uC870\uBB38": "\uACF5\uC815\uAC70\uB798\uBC95 \uC81C19\uC870 \uC81C1\uD56D \uC81C1\uD638\xB7\uC81C3\uD638\xB7\uC81C4\uD638",
      "\uC0B0\uC5C5\uBD84\uC57C": "\uC0B0\uC5C5\uC6A9 \uD38C\uD504 \uC81C\uC870\uC5C5 (\uC870\uB2EC\uCCAD \uBC1C\uC8FC \uC785\uCD95\uD38C\uD504 \uC2DC\uC7A5)",
      "\uC804\uC81C1": "\uACF5\uC815\uAC70\uB798\uBC95 \uC81C19\uC870 \uC81C1\uD56D \uC81C8\uD638: \uC0AC\uC5C5\uC790\uB294 \uACC4\uC57D\xB7\uD611\uC815\xB7\uACB0\uC758 \uAE30\uD0C0 \uC5B4\uB5A0\uD55C \uBC29\uBC95\uC73C\uB85C\uB3C4 \uB2E4\uB978 \uC0AC\uC5C5\uC790\uC640 \uACF5\uB3D9\uC73C\uB85C \uBD80\uB2F9\uD558\uAC8C \uACBD\uC7C1\uC744 \uC81C\uD55C\uD558\uB294 \uC785\uCC30 \uB610\uB294 \uACBD\uB9E4\uC5D0 \uC788\uC5B4 \uB099\uCC30\uC790, \uACBD\uB77D\uC790, \uD22C\uCC30\uAC00\uACA9, \uB099\uCC30\uAC00\uACA9 \uB610\uB294 \uACBD\uB77D\uAC00\uACA9, \uADF8 \uBC16\uC5D0 \uB300\uD1B5\uB839\uB839\uC73C\uB85C \uC815\uD558\uB294 \uC0AC\uD56D\uC744 \uACB0\uC815\uD558\uB294 \uD589\uC704\uB97C \uD560 \uAC83\uC744 \uD569\uC758\uD558\uC5EC\uC11C\uB294 \uC544\uB2C8 \uB41C\uB2E4",
      "\uC804\uC81C2": "\uBCF8 \uC0AC\uAC74\uC740 \u2460 10\uAC1C \uC0AC\uC5C5\uC790 \uAC04 \uBA85\uC2DC\uC801 \uD569\uC758 \uC874\uC7AC (\uB300\uC804\uC5ED\xB7\uC11C\uC6B8\uCCAD \uC778\uADFC \uC74C\uC2DD\uC810 \uD68C\uD569), \u2461 \uB099\uCC30\uC608\uC815\uC790\xB7\uD22C\uCC30\uAC00\uACA9 \uC0AC\uC804\uACB0\uC815 \uBC0F \uC21C\uBC88\uC81C\xB7\uACF5\uB3D9\uC21C\uBC88\uC81C\xB7\uC774\uC775\uAE08\uBC30\uBD84\uC81C\uB85C 39\uAC74 \uC785\uCC30\uBB3C\uB7C9 \uBC30\uBD84, \u2462 \uB099\uCC30\uB960 92~99% \uC218\uC900\uC73C\uB85C \uACBD\uC7C1 \uBD80\uB2F9 \uC81C\uD55C, \u2463 4\uB144 5\uAC1C\uC6D4\uAC04 \uC9C0\uC18D \uC2E4\uD589 \u2014 4 \uC694\uAC74 \uBAA8\uB450 \uCDA9\uC871",
      "\uACB0\uB860": "\uACF5\uC815\uAC70\uB798\uBC95 \uC81C19\uC870 \uC81C1\uD56D \uC81C8\uD638 (\uBD80\uB2F9\uD55C \uACF5\uB3D9\uD589\uC704 - \uC785\uCC30\uB2F4\uD569) \uC704\uBC18"
    },

        "a": "\uACF5\uC815\uAC70\uB798\uC704\uC6D0\uD68C\uAC00 \uD38C\uD504 \uB9CC\uB4DC\uB294 \uD68C\uC0AC 10\uACF3\uC5D0 \uC2DC\uC815\uBA85\uB839(\uC55E\uC73C\uB85C \uADF8\uB7F0 \uC9D3 \uD558\uC9C0 \uB9D0\uB77C\uB294 \uBA85\uB839)\uC744 \uB0B4\uB9AC\uACE0, \uACFC\uC9D5\uAE08(\uBC8C\uAE08 \uAC19\uC740 \uAC70\uC608\uC694) \uCD1D 22\uC5B5 4,500\uB9CC \uC6D0\uC744 \uBD80\uACFC\uD588\uC5B4\uC694. \uD68C\uC0AC\uB9C8\uB2E4 \uAE08\uC561\uC774 \uB2EC\uB790\uB294\uB370, \uAC00\uC7A5 \uB9CE\uC774 \uB0B8 \uACF3\uC740 \uAE08\uC804\uAE30\uC5C5\uC73C\uB85C \uC57D 5\uC5B5 \uC6D0\uC774\uC5D0\uC694.",
        "g": "\uACFC\uC9D5\uAE08\uC561 : \uCD1D\uACC4 2,245,000,000\uC6D0 | \uD53C\uC2EC\uC778\uB4E4\uC740... \uAD6D\uB0B4 \uC785\uCD95\uD38C\uD504 \uC785\uCC30\uC2DC\uC7A5\uC5D0\uC11C \uBD80\uB2F9\uD558\uAC8C \uACBD\uC7C1\uC744 \uC81C\uD55C\uD558\uB294 \uD589\uC704\uB97C \uB2E4\uC2DC \uD558\uC5EC\uC11C\uB294 \uC544\uB2C8\uB41C\uB2E4. | \uD53C\uC2EC\uC778\uB4E4\uC740 \uC870\uB2EC\uCCAD\uC5D0\uC11C \uBC1C\uC8FC\uD558\uB294 \uC785\uCD95\uD38C\uD504 \uAD6C\uB9E4\uC785\uCC30\uC5D0 \uCC38\uC5EC\uD558\uBA74\uC11C... \uBD80\uB2F9\uD558\uAC8C \uACBD\uC7C1\uC744 \uC81C\uD55C\uD558\uB294 \uD589\uC704\uB97C \uB2E4\uC2DC \uD558\uC5EC\uC11C\uB294 \uC544\uB2C8\uB41C\uB2E4. | \uD53C\uC2EC\uC778\uB4E4\uC740 \uB2E4\uC74C \uAC01\uD638\uC5D0 \uB530\uB77C \uACFC\uC9D5\uAE08\uC744 \uAD6D\uACE0\uC5D0 \uB0A9\uBD80\uD558\uC5EC\uC57C \uD55C\uB2E4. | \uACFC\uC9D5\uAE08\uC561 : \uCD1D\uACC4 2,245,0\u2026"
      },

        "q": "\uC774 \uD68C\uC0AC\uB4E4\uC774 \uB3C4\uB300\uCCB4 \uC5B4\uB5A4 \uBC95\uC744 \uC5B4\uAE34 \uAC70\uC608\uC694?",
        "a": "\uACF5\uC815\uAC70\uB798\uBC95(\uC2DC\uC7A5\uC5D0\uC11C \uD68C\uC0AC\uB4E4\uC774 \uACF5\uC815\uD558\uAC8C \uACBD\uC7C1\uD558\uB3C4\uB85D \uADDC\uC815\uD55C \uBC95\uC774\uC5D0\uC694) \uC81C19\uC870\uB97C \uC5B4\uACBC\uC5B4\uC694. \uC27D\uAC8C \uB9D0\uD558\uBA74, \uC11C\uB85C \uC9DC\uACE0 \uC785\uCC30(\uB098\uB77C\uC5D0\uC11C \uBB3C\uAC74 \uC0B4 \uB54C \uC5EC\uB7EC \uD68C\uC0AC\uAC00 \uAC00\uACA9 \uACBD\uC7C1\uD558\uB294 \uAC83)\uC5D0\uC11C \uB204\uAC00 \uC774\uAE38\uC9C0, \uAC00\uACA9\uC740 \uC5BC\uB9C8\uB85C \uD560\uC9C0 \uBBF8\uB9AC \uC815\uD55C \uAC70\uC608\uC694. \uC774\uB7F0 \uD589\uC704\uB97C \uB2F4\uD569\uC774\uB77C\uACE0 \uD574\uC694.",
        "g": "\uC77C\uC9C4\uC804\uAE30 \uC8FC\uC2DD\uD68C\uC0AC, \uD6A8\uC131\uAD7F\uC2A4\uD504\uB9C1\uC2A4 \uC8FC\uC2DD\uD68C\uC0AC, \uC8FC\uC2DD\uD68C\uC0AC \uC2E0\uC2E0\uAE30\uACC4... 10\uAC1C\uC0AC\uB294 \uC785\uCD95\uD38C\uD504\uB97C \uC81C\uC791\xB7\uB0A9\uD488\xB7\uC124\uCE58\uD558\uB294 \uC0AC\uC5C5\uC744 \uC601\uC704\uD558\uB294 \uC790\uB4E4 | \uB3C5\uC810\uADDC\uC81C \uBC0F \uACF5\uC815\uAC70\uB798\uC5D0 \uAD00\uD55C \uBC95\uB960(\uC774\uD558 '\uBC95'\uC774\uB77C \uD55C\uB2E4) \uC81C2\uC870 \uC81C1\uD638\uC5D0\uC11C \uADDC\uC815\uD558\uACE0 \uC788\uB294 \uC0AC\uC5C5\uC790\uC5D0 \uD574\uB2F9\uD558\uBA70... | \uD53C\uC2EC\uC778\uB4E4\uC740... \uAD6D\uB0B4 \uC785\uCD95\uD38C\uD504 \uC785\uCC30\uC2DC\uC7A5\uC5D0\uC11C \uBD80\uB2F9\uD558\uAC8C \uACBD\uC7C1\uC744 \uC81C\uD55C\uD558\uB294 \uD589\uC704\uB97C \uB2E4\uC2DC \uD558\uC5EC\uC11C\uB294 \uC544\uB2C8\uB41C\uB2E4. | ...\uAC01 \uC785\uCC30 \uAC74\uB9C8\uB2E4\u2026"

        "diff": "\uC2EC\uD654",
        "q": "\uC870\uB2EC\uCCAD \uBC1C\uC8FC \uAD00\uAE09 \uC785\uCC30\uB2F4\uD569 \uC0AC\uAC74\uC774 \uBC18\uBCF5\uC801\uC73C\uB85C \uC801\uBC1C\uB418\uB294 \uD328\uD134\uC774 \uC788\uB2E4\uBA74, \uB2F9\uC0AC \uC785\uCC30 \uCC38\uC5EC \uC2DC \uC5B4\uB5A4 \uC0C1\uD669\uC5D0\uC11C \uB9AC\uC2A4\uD06C\uAC00 \uB192\uC544\uC9C0\uB294\uC9C0 \uC2E4\uBB34 \uAE30\uC900\uC774 \uC788\uC2B5\uB2C8\uAE4C?",
        "a": "\uAD00\uAE09 \uC785\uCC30\uB2F4\uD569\uC740 \uC2DC\uC7A5 \uCC38\uC5EC\uC790\uAC00 \uC18C\uC218\uC774\uACE0 \uBC1C\uC8FC\uCC98\uAC00 \uB2E8\uC77C\uD55C \uAD6C\uC870\uC5D0\uC11C \uBC18\uBCF5 \uBC1C\uC0DD\uD558\uB294 \uACBD\uD5A5\uC774 \uC788\uC2B5\uB2C8\uB2E4. \uBCF8 \uC0AC\uAC74\uB3C4 \uC785\uCD95\uD38C\uD504 \uC2DC\uC7A5 \uC0AC\uC5C5\uC790 \uC57D 10\uAC1C\uC0AC\uAC00 \uC2DC\uC7A5 \uB300\uBD80\uBD84\uC744 \uC810\uC720\uD55C \uACFC\uC810 \uAD6C\uC870\uC5D0\uC11C 4\uB144 5\uAC1C\uC6D4\uAC04 \uC9C0\uC18D\uB41C \uC0AC\uB840\uC785\uB2C8\uB2E4. \uB2F9\uC0AC \uC785\uCC30 \uCC38\uC5EC \uC2DC \uB9AC\uC2A4\uD06C \uC218\uC900\uC774 \uB192\uC544\uC9C0\uB294 \uC0C1\uD669 \uAE30\uC900\uC740 \uB2E4\uC74C\uACFC \uAC19\uC2B5\uB2C8\uB2E4. \u2460 \uD2B9\uC815 \uBC1C\uC8FC\uCC98(\uC870\uB2EC\uCCAD\xB7\uACF5\uACF5\uAE30\uAD00)\uC5D0 \uB300\uD55C \uC785\uCC30 \uCC38\uC5EC \uC5C5\uCCB4\uAC00 3~5\uAC1C \uC774\uD558\uB85C \uACE0\uC815\uB418\uB294 \uACBD\uC6B0, \u2461 \uB099\uCC30 \uC21C\uBC88\uC774 \uC0AC\uC2E4\uC0C1 \uACE0\uC815\uB418\uAC70\uB098 \uACBD\uC7C1\uC0AC \uD22C\uCC30 \uD3EC\uAE30\uAC00 \uAD00\uD589\uD654\uB41C \uACBD\uC6B0, \u2462 \uC785\uCC30 \uC804 \uACBD\uC7C1\uC0AC \uB2F4\uB2F9\uC790\uC640 \uD22C\uCC30\uAC00\uACA9\xB7\uC218\uC8FC \uC21C\uC11C\uC5D0 \uAD00\uD55C \uC815\uBCF4\uB97C \uAD50\uD658\uD55C \uC0AC\uC2E4\uC774 \uC788\uB294 \uACBD\uC6B0. \uC704 \uC0C1\uD669 \uC911 \uD558\uB098\uB77C\uB3C4 \uD574\uB2F9\uD558\uBA74 \uC989\uC2DC \uB0B4\uBD80 \uBC95\uBB34\xB7\uCEF4\uD50C\uB77C\uC774\uC5B8\uC2A4 \uBD80\uC11C\uC5D0 \uC5D0\uC2A4\uCEEC\uB808\uC774\uC158\uD558\uACE0, \uD574\uB2F9 \uC785\uCC30 \uAC74\uC5D0 \uB300\uD55C \uB3C5\uB9BD\uC801 \uAC00\uACA9 \uACB0\uC815 \uD504\uB85C\uC138\uC2A4\uB97C \uBB38\uC11C\uB85C \uB0A8\uACA8\uC57C \uD569\uB2C8\uB2E4.",
        "g": "\uC9C0\uBC29\uC790\uCE58\uB2E8\uCCB4\uB098 \uB18D\uC5B4\uCD0C\uACF5\uC0AC \uB4F1 \uACF5\uACF5\uAE30\uAD00\uC5D0\uC11C \uC790\uC2E0\uC774 \uAD00\uB9AC\uD558\uB294 \uBE57\uBB3C \uB610\uB294 \uBC30\uC218\uD38C\uD504\uC7A5\uC5D0\uC11C \uD38C\uD504\uC758 \uB178\uD654 \uB4F1\uC73C\uB85C \uC778\uD55C \uC218\uC694\uAC00 \uBC1C\uC0DD\uD560 \uACBD\uC6B0... | \uC785\uCD95\uD38C\uD504 \uC2DC\uC7A5\uC5D0\uB294 \uC57D 10\uAC1C\uC758 \uC0AC\uC5C5\uC790\uAC00 \uCC38\uC5EC\uD558\uACE0 \uC788\uACE0... | \uC77C\uC9C4\uC804\uAE30 \uC8FC\uC2DD\uD68C\uC0AC, \uD6A8\uC131\uAD7F\uC2A4\uD504\uB9C1\uC2A4 \uC8FC\uC2DD\uD68C\uC0AC, \uC8FC\uC2DD\uD68C\uC0AC \uC2E0\uC2E0\uAE30\uACC4... 10\uAC1C\uC0AC\uB294 \uC785\uCD95\uD38C\uD504\uB97C \uC81C\uC791\xB7\uB0A9\uD488\xB7\uC124\uCE58\uD558\uB294 \uC0AC\uC5C5\uC744 \uC601\uC704\uD558\uB294 \uC790\uB4E4 | \uC11C\uC77C\uAE30\uACC4\uACF5\uC5C5(\uC8FC)\uB3C4 \uC774 \uC0AC\uAC74 \uACF5\uB3D9\uD589\uC704\uC5D0 \uCC38\uC5EC\u2026"
      },
      {
        "ID": "024",
        "persona": "\uAE30\uC5C5 \uCEF4\uD50C\uB77C\uC774\uC5B8\uC2A4 \uB2F4\uB2F9\uC790",
        "qtype": "\uD1B5\uACC4\uAE30\uBC18",
        "diff": "\uC2EC\uD654",
        "q": "\uBCF8 \uC0AC\uAC74\uC5D0\uC11C \uB099\uCC30\uB960 92~99% \uC218\uC900\uC774 \uB2F4\uD569\uC758 \uC99D\uAC70\uB85C \uD65C\uC6A9\uB418\uC5C8\uB294\uB370, \uB2F9\uC0AC\uAC00 \uACE0\uB099\uCC30\uB960 \uC785\uCC30 \uAC74\uC5D0 \uB300\uD574 \uB0B4\uBD80 \uBAA8\uB2C8\uD130\uB9C1 \uAE30\uC900\uC744 \uC5B4\uB5BB\uAC8C \uC124\uC815\uD574\uC57C \uD569\uB2C8\uAE4C?",
        "a": "\uBCF8 \uC0AC\uAC74\uC5D0\uC11C \uACF5\uC815\uC704\uB294 \uD6A8\uC131\uAD7F\uC2A4\uD504\uB9C1\uC2A4 \uB099\uCC30\uB960 93.38%, \uC2E0\uC2E0\uAE30\uACC4 \uB099\uCC30\uB960 99.36% \uB4F1 \uBE44\uC815\uC0C1\uC801\uC73C\uB85C \uB192\uC740 \uB099\uCC30\uB960 \uD328\uD134\uC744 \uB2F4\uD569 \uC2E4\uD589\uC758 \uADFC\uAC70\uB85C \uD65C\uC6A9\uD558\uC600\uC2B5\uB2C8\uB2E4(\uC785\uCD95\uD38C\uD504_016). \uB2F9\uC0AC \uB0B4\uBD80 \uBAA8\uB2C8\uD130\uB9C1 \uAE30\uC900 \uC124\uC815\uC744 \uC704\uD574 \uB2E4\uC74C \uB450 \uB2E8\uACC4\uB97C \uAD8C\uACE0\uD569\uB2C8\uB2E4. \uCCAB\uC9F8, \uB3D9\uC885 \uBC1C\uC8FC\uCC98\xB7\uB3D9\uC885 \uD488\uBAA9\uAD70\uC5D0\uC11C \uB099\uCC30\uB960\uC774 90% \uC774\uC0C1\uC778 \uC785\uCC30 \uAC74\uC774 2\uD68C \uC774\uC0C1 \uC5F0\uC18D \uBC1C\uC0DD\uD558\uB294 \uACBD\uC6B0 \uC774\uC0C1 \uC9D5\uD6C4\uB85C \uBD84\uB958\uD558\uB294 \uC784\uACC4\uAC12\uC744 \uC124\uC815\uD569\uB2C8\uB2E4. \uB458\uC9F8, \uC774\uC0C1 \uC9D5\uD6C4 \uBD84\uB958 \uAC74\uC5D0 \uB300\uD574\uC11C\uB294 \u2460 \uACBD\uC7C1\uC0AC \uD22C\uCC30\uAC00\uACA9 \uC815\uBCF4 \uC785\uC218 \uACBD\uC704, \u2461 \uC790\uC0AC \uAC00\uACA9 \uACB0\uC815 \uADFC\uAC70 \uBB38\uC11C, \u2462 \uC785\uCC30 \uC804 \uACBD\uC7C1\uC0AC \uC811\uCD09 \uC774\uB825\uC744 \uCEF4\uD50C\uB77C\uC774\uC5B8\uC2A4 \uBD80\uC11C\uAC00 \uC18C\uAE09 \uAC80\uD1A0\uD558\uB294 \uD504\uB85C\uC138\uC2A4\uB97C \uBD84\uAE30\uBCC4 \uB0B4\uBD80\uAC10\uC0AC \uD56D\uBAA9\uC5D0 \uD3EC\uD568\uD574\uC57C \uD569\uB2C8\uB2E4. \uB099\uCC30\uB960 \uBAA8\uB2C8\uD130\uB9C1\uC740 \uB2F4\uD569 \uC0AC\uC804 \uC608\uBC29\uC758 \uAC00\uC7A5 \uC2E4\uC6A9\uC801\uC778 \uB0B4\uBD80\uD1B5\uC81C \uC218\uB2E8 \uC911 \uD558\uB098\uC785\uB2C8\uB2E4.",
        "g": "\uD569\uC758\uC5D0 \uB530\uB77C \uD6A8\uC131\uC774 \uB099\uCC30\uB960 93.38%\uB85C \uB099\uCC30... \uD569\uC758\uC5D0 \uB530\uB77C \uC2E0\uC2E0\uAE30\uACC4\uAC00 \uB099\uCC30\uB960 99.36%\uB85C \uB099\uCC30 | \uC77C\uC9C4\uC804\uAE30 \uC8FC\uC2DD\uD68C\uC0AC, \uD6A8\uC131\uAD7F\uC2A4\uD504\uB9C1\uC2A4 \uC8FC\uC2DD\uD68C\uC0AC, \uC8FC\uC2DD\uD68C\uC0AC \uC2E0\uC2E0\uAE30\uACC4... 10\uAC1C\uC0AC\uB294 \uC785\uCD95\uD38C\uD504\uB97C \uC81C\uC791\xB7\uB0A9\uD488\xB7\uC124\uCE58\uD558\uB294 \uC0AC\uC5C5\uC744 \uC601\uC704\uD558\uB294 \uC790\uB4E4 | \uC11C\uC77C\uAE30\uACC4\uACF5\uC5C5(\uC8FC)\uB3C4 \uC774 \uC0AC\uAC74 \uACF5\uB3D9\uD589\uC704\uC5D0 \uCC38\uC5EC\uD558\uC600\uC73C\uB098, 2012. 2. 28. \uD3D0\uC5C5\uD568\uC5D0 \uB530\uB77C \uD53C\uC2EC\uC778\uC5D0\uC11C \uC81C\uC678\uD55C\uB2E4. | \uC9C0\uBC29\uC790\uCE58\uB2E8\uCCB4\uB098 \uB18D\uC5B4\uCD0C\u2026"
      },
      {
        "ID": "045",
        "persona": "\uB17C\uBB38 \uC900\uBE44 \uD559\uC0DD",
        "qtype": "\uC2DC\uC7A5\uC601\uD5A5",
        "diff": "\uC804\uBB38\uAC00",
        "q": "\uBCF8 \uC0AC\uAC74\uC774 \uC870\uB2EC\uCCAD \uBC1C\uC8FC \uC785\uCD95\uD38C\uD504 \uC2DC\uC7A5\uC758 \uACBD\uC7C1 \uAD6C\uC870 \uBC0F \uACF5\uACF5 \uC870\uB2EC \uD6A8\uC728\uC131\uC5D0 \uBBF8\uCE5C \uC0B0\uC5C5\uC801\xB7\uC815\uCC45\uC801 \uD568\uC758\uB97C \uBD84\uC11D\uD558\uACE0, \uACF5\uACF5 \uC870\uB2EC \uC2DC\uC7A5\uC5D0\uC11C\uC758 \uC785\uCC30\uB2F4\uD569 \uC5B5\uC81C\uB97C \uC704\uD55C \uD6C4\uC18D \uC815\uCC45 \uACFC\uC81C\uB97C \uC81C\uC2DC\uD558\uB77C.",
        "a": "\uBCF8 \uC0AC\uAC74\uC740 \uC870\uB2EC\uCCAD \uBC1C\uC8FC \uC785\uCD95\uD38C\uD504 \uC2DC\uC7A5\uC5D0\uC11C \uC57D 10\uAC1C \uC0AC\uC5C5\uC790\uAC00 \uC2DC\uC7A5\uC758 \uAC70\uC758 100%\uB97C \uC810\uC720\uD558\uB294 \uACE0\uC9D1\uC911\uB3C4 \uAD6C\uC870\uD558\uC5D0, \uC870\uB2EC\uCCAD\uC758 \uB0A9\uD488\uC2E4\uC801 \uC694\uAC74\uC73C\uB85C \uC778\uD55C \uC9C4\uC785\uC7A5\uBCBD\uACFC \uBC18\uBCF5\uC801 \uC870\uB2EC \uBC1C\uC8FC \uD328\uD134\uC774 \uB2F4\uD569 \uD615\uC131\xB7\uC720\uC9C0\uB97C \uAD6C\uC870\uC801\uC73C\uB85C \uAC00\uB2A5\uD558\uAC8C \uD55C \uC0AC\uB840\uB85C \uBD84\uC11D\uB41C\uB2E4. 4\uB144 5\uAC1C\uC6D4\uAC04 39\uAC74 \uC785\uCC30\uC5D0\uC11C \uB099\uCC30\uB960 92~99%\uAC00 \uC720\uC9C0\uB41C \uAC83\uC740, \uACBD\uC7C1\uC774 \uC2E4\uC9C8\uC801\uC73C\uB85C \uC18C\uBA78\uB41C \uC0C1\uD0DC\uC5D0\uC11C \uACF5\uACF5 \uC870\uB2EC \uD6A8\uC728\uC131\uC774 \uC2EC\uAC01\uD558\uAC8C \uC800\uD574\uB418\uC5C8\uC74C\uC744 \uC2DC\uC0AC\uD55C\uB2E4.\n\n\uC0B0\uC5C5\uC801 \uD568\uC758\uB294 \uB2E4\uC74C \uC138 \uCE21\uBA74\uC5D0\uC11C \uAC80\uD1A0\uB41C\uB2E4. \uCCAB\uC9F8, \uC218\uC694\uC790(\uC9C0\uBC29\uC790\uCE58\uB2E8\uCCB4\xB7\uB18D\uC5B4\uCD0C\uACF5\uC0AC \uB4F1 \uACF5\uACF5\uAE30\uAD00)\uC758 \uD6C4\uC0DD \uC190\uC2E4: \uACBD\uC7C1 \uB099\uCC30 \uC2DC \uB2EC\uC131 \uAC00\uB2A5\uD55C \uAC00\uACA9 \uB300\uBE44 \uCD08\uACFC \uC9C0\uCD9C\uC774 \uC138\uAE08 \uB0AD\uBE44\uB85C \uADC0\uACB0\uB418\uBA70, \uD2B9\uD788 \uBC30\uC218\uD38C\uD504\uC7A5 \uB4F1 \uACF5\uACF5 \uC778\uD504\uB77C \uC720\uC9C0\xB7\uBCF4\uC218 \uC608\uC0B0\uC758 \uBE44\uD6A8\uC728\uC801 \uC9D1\uD589\uC744 \uCD08\uB798\uD558\uC600\uB2E4. \uB458\uC9F8, \uC2DC\uC7A5 \uAD6C\uC870\uC758 \uACBD\uC9C1\uD654: \uB0A9\uD488\uC2E4\uC801 \uC694\uAC74\uC73C\uB85C \uC778\uD55C \uC9C4\uC785\uC7A5\uBCBD\uACFC \uB2F4\uD569\uC73C\uB85C \uC778\uD55C \uACBD\uC7C1 \uC18C\uBA78\uC774 \uACB0\uD569\uB418\uC5B4 \uC2E0\uADDC \uC9C4\uC785 \uC5B5\uC81C \uD6A8\uACFC\uAC00 \uC911\uCCA9\uB41C \uAC83\uC73C\uB85C \uD3C9\uAC00\uB41C\uB2E4. \uC774\uB294 '\uC778\uC704\uC801 \uC9C4\uC785\uC7A5\uBCBD + \uB2F4\uD569'\uC758 \uBCF5\uD569 \uAD6C\uC870\uAC00 \uACBD\uC7C1 \uBCF5\uC6D0\uC744 \uB354\uC6B1 \uC5B4\uB835\uAC8C \uD558\uB294 \uD328\uD134\uC744 \uBCF4\uC5EC\uC8FC\uB294 \uC120\uB840\uB85C \uC758\uBBF8\uB97C \uAC00\uC9C4\uB2E4. \uC14B\uC9F8, \uB2F4\uD569 \uC774\uD0C8 \uC778\uC13C\uD2F0\uBE0C \uAD6C\uC870: \uC774\uC775\uAE08\uBC30\uBD84\uC81C\uB294 \uC774\uD0C8 \uC2DC \uBD84\uBC30 \uC774\uC775 \uC0C1\uC2E4\uC774\uB77C\uB294 \uAE30\uD68C\uBE44\uC6A9\uC744 \uBC1C\uC0DD\uC2DC\uCF1C \uB2F4\uD569 \uC548\uC815\uC131\uC744 \uAC15\uD654\uD55C \uAC83\uC73C\uB85C \uBD84\uC11D\uB418\uBA70, \uC774\uB294 \uAC8C\uC784\uC774\uB860\uC801 \uAD00\uC810\uC5D0\uC11C\uC758 \uBC18\uBCF5 \uAC8C\uC784 \uADE0\uD615 \uC720\uC9C0 \uBA54\uCEE4\uB2C8\uC998\uACFC \uC815\uD569\uD55C\uB2E4.\n\n\uC815\uCC45\uC801 \uD568\uC758\uC640 \uD6C4\uC18D \uACFC\uC81C\uB85C\uB294 \uB2E4\uC74C\uC774 \uC81C\uC548\uB41C\uB2E4. \uCCAB\uC9F8, \uACF5\uACF5 \uC870\uB2EC \uC785\uCC30 \uC870\uAC74\uC758 \uACBD\uC7C1\uCD09\uC9C4\uC801 \uC7AC\uC124\uACC4 \u2014 \uB0A9\uD488\uC2E4\uC801 \uC694\uAC74\uC758 \uBE44\uB840\uC131 \uAC80\uD1A0 \uBC0F \uC9C4\uC785\uC7A5\uBCBD \uC644\uD654 \uC815\uCC45. \uB458\uC9F8, \uC870\uB2EC\uCCAD \uB0B4 \uC785\uCC30 \uD328\uD134 \uC790\uB3D9 \uAC10\uC9C0 \uC2DC\uC2A4\uD15C \uAD6C\uCD95 \u2014 \uB099\uCC30\uB960\xB7\uB099\uCC30\uC5C5\uCCB4 \uC21C\uD658 \uD328\uD134\uC758 \uC54C\uACE0\uB9AC\uC998 \uBAA8\uB2C8\uD130\uB9C1. \uC14B\uC9F8, \uC785\uCC30\uB2F4\uD569 \uC2E0\uACE0 \uC778\uC13C\uD2F0\uBE0C(\uB9AC\uB2C8\uC5B8\uC2DC \uC81C\uB3C4) \uAC15\uD654 \uBC0F \uACF5\uACF5 \uC870\uB2EC \uBD80\uBB38 \uD2B9\uD654 \uC9D1\uD589 \uCCB4\uACC4 \uB9C8\uB828. \uD6C4\uC18D \uC5F0\uAD6C\uB85C\uB294 (i) \uBCF8 \uC0AC\uAC74 \uC774\uD6C4 \uC785\uCD95\uD38C\uD504 \uC2DC\uC7A5 \uB099\uCC30\uB960\xB7\uACBD\uC7C1 \uAD6C\uC870 \uBCC0\uD654 \uCD94\uC774 \uBD84\uC11D, (ii) \uACF5\uACF5 \uC870\uB2EC \uC9C4\uC785\uC7A5\uBCBD\uACFC \uB2F4\uD569 \uBE48\uB3C4 \uAC04\uC758 \uACC4\uB7C9\uACBD\uC81C\uD559\uC801 \uBD84\uC11D, (iii) \uC870\uB2EC\uCCAD \uC785\uCC30 \uB370\uC774\uD130\uB97C \uD65C\uC6A9\uD55C \uB2F4\uD569 \uC870\uAE30 \uAC10\uC9C0 \uBAA8\uD615 \uAC1C\uBC1C\uC774 \uC81C\uC548\uB41C\uB2E4.",
        "g": "\uC9C0\uBC29\uC790\uCE58\uB2E8\uCCB4\uB098 \uB18D\uC5B4\uCD0C\uACF5\uC0AC \uB4F1 \uACF5\uACF5\uAE30\uAD00\uC5D0\uC11C \uC790\uC2E0\uC774 \uAD00\uB9AC\uD558\uB294 \uBE57\uBB3C \uB610\uB294 \uBC30\uC218\uD38C\uD504\uC7A5\uC5D0\uC11C \uD38C\uD504\uC758 \uB178\uD654 \uB4F1\uC73C\uB85C \uC778\uD55C \uC218\uC694\uAC00 \uBC1C\uC0DD\uD560 \uACBD\uC6B0... | \uC785\uCD95\uD38C\uD504 \uC2DC\uC7A5\uC5D0\uB294 \uC57D 10\uAC1C\uC758 \uC0AC\uC5C5\uC790\uAC00 \uCC38\uC5EC\uD558\uACE0 \uC788\uACE0... | \uC77C\uC9C4\uC804\uAE30 \uC8FC\uC2DD\uD68C\uC0AC, \uD6A8\uC131\uAD7F\uC2A4\uD504\uB9C1\uC2A4 \uC8FC\uC2DD\uD68C\uC0AC, \uC8FC\uC2DD\uD68C\uC0AC \uC2E0\uC2E0\uAE30\uACC4... 10\uAC1C\uC0AC\uB294 \uC785\uCD95\uD38C\uD504\uB97C \uC81C\uC791\xB7\uB0A9\uD488\xB7\uC124\uCE58\uD558\uB294 \uC0AC\uC5C5\uC744 \uC601\uC704\uD558\uB294 \uC790\uB4E4 | \uC11C\uC77C\uAE30\uACC4\uACF5\uC5C5(\uC8FC)\uB3C4 \uC774 \uC0AC\uAC74 \uACF5\uB3D9\uD589\uC704\uC5D0 \uCC38\uC5EC\u2026"
      },
      {
        "ID": "042",
        "persona": "\uB17C\uBB38 \uC900\uBE44 \uD559\uC0DD",
        "qtype": "\uBC95\uB839\uC911\uC2EC",
        "diff": "\uC804\uBB38\uAC00",
        "q": "\uACF5\uC815\uAC70\uB798\uBC95 \uC81C19\uC870 \uC81C1\uD56D \uC81C8\uD638\uC758 \uC785\uCC30\uB2F4\uD569 \uAD6C\uC131\uC694\uAC74 \uCDA9\uC871 \uD310\uB2E8\uC5D0\uC11C \uBCF8 \uC0AC\uAC74\uC774 \uAC16\uB294 \uC120\uB840\uC801 \uC758\uBBF8\uC640 \uBE44\uAD50\uBC95\uC801 \uC2DC\uC0AC\uC810\uC740 \uBB34\uC5C7\uC778\uAC00?",
        "a": "\uACF5\uC815\uAC70\uB798\uBC95 \uC81C19\uC870 \uC81C1\uD56D \uC81C8\uD638\uB294 '\uC0AC\uC5C5\uC790\uAC00 \uB2E4\uB978 \uC0AC\uC5C5\uC790\uC640 \uACF5\uB3D9\uC73C\uB85C \uBD80\uB2F9\uD558\uAC8C \uACBD\uC7C1\uC744 \uC81C\uD55C\uD558\uB294 \uC785\uCC30\uC5D0\uC11C \uB099\uCC30\uC790\xB7\uD22C\uCC30\uAC00\uACA9 \uB4F1\uC744 \uACB0\uC815\uD558\uB294 \uD589\uC704\uB97C \uD569\uC758'\uD558\uB294 \uAC83\uC744 \uAE08\uC9C0\uD55C\uB2E4. \uBCF8 \uC0AC\uAC74\uC5D0\uC11C \uACF5\uC815\uAC70\uB798\uC704\uC6D0\uD68C\uB294 4\uAC00\uC9C0 \uAD6C\uC131\uC694\uAC74 \u2014 \u2460 \uD569\uC758 \uC874\uC7AC, \u2461 \uC0AC\uC804 \uACB0\uC815 \uD589\uC704, \u2462 \uACBD\uC7C1 \uBD80\uB2F9 \uC81C\uD55C, \u2463 \uC2E4\uD589\uD589\uC704 \u2014 \uC744 \uBAA8\uB450 \uCDA9\uC871\uD558\uB294 \uAC83\uC73C\uB85C \uD310\uB2E8\uD558\uC600\uC73C\uBA70, \uC774\uB294 \uAD00\uAE09 \uC785\uCC30\uB2F4\uD569 \uC0AC\uAC74\uC5D0\uC11C\uC758 \uAD6C\uC131\uC694\uAC74 \uD3EC\uC12D \uBC29\uC2DD\uC744 \uAD6C\uCCB4\uD654\uD55C \uC120\uB840\uB85C \uD3C9\uAC00\uB41C\uB2E4.\n\n\uC120\uB840\uC801 \uC758\uBBF8\uB294 \uB2E4\uC74C \uC138 \uCE21\uBA74\uC5D0\uC11C \uBD84\uC11D\uB41C\uB2E4. \uCCAB\uC9F8, \uD569\uC758 \uD615\uC131 \uBC29\uC2DD\uC758 \uB2E4\uC591\uC131 \uC778\uC815: \uBCF8 \uC0AC\uAC74\uC740 \uC21C\uBC88\uC81C\xB7\uACF5\uB3D9\uC21C\uBC88\uC81C\xB7\uC774\uC775\uAE08\uBC30\uBD84\uC81C\uB77C\uB294 \uBCF5\uD569\uC801 \uBA54\uCEE4\uB2C8\uC998\uC744 \uD1B5\uD55C \uD569\uC758\uAC00 \uACF5\uC815\uAC70\uB798\uBC95\uC0C1 '\uACC4\uC57D\xB7\uD611\uC815\xB7\uACB0\uC758 \uAE30\uD0C0 \uBC29\uBC95'\uC5D0 \uD574\uB2F9\uD568\uC744 \uD655\uC778\uD558\uC600\uC73C\uBA70, \uC774\uB294 \uB2F4\uD569 \uD569\uC758\uC758 \uD615\uC2DD\uBCF4\uB2E4 \uC2E4\uC9C8\uC801 \uACBD\uC7C1 \uC81C\uD55C \uD6A8\uACFC\uB97C \uC911\uC2EC\uC73C\uB85C \uD310\uB2E8\uD558\uB294 \uAE30\uB2A5\uC8FC\uC758\uC801 \uD574\uC11D\uC744 \uC9C0\uC9C0\uD55C\uB2E4. \uB458\uC9F8, \uB099\uCC30\uB960 \uC218\uCE58(92~99%)\uC758 \uC99D\uAC70\uB825: \uACE0\uB099\uCC30\uB960\uC774 \uACBD\uC7C1 \uBD80\uB2F9 \uC81C\uD55C\uC758 \uC815\uD669 \uC99D\uAC70\uB85C \uD65C\uC6A9\uB41C \uC810\uC740, \uACBD\uC81C\uC801 \uBD84\uC11D \uBC29\uBC95\uB860\uC774 \uBC95\uB9AC \uD310\uB2E8\uC5D0 \uD1B5\uD569\uB418\uB294 \uCD94\uC138\uC640 \uBD80\uD569\uD558\uBA70, \uC774\uB978\uBC14 '\uACBD\uC81C\uC801 \uC99D\uAC70\uC758 \uBC95\uC815\uD654' \uB17C\uC758\uC640 \uC5F0\uACB0\uB41C\uB2E4. \uC14B\uC9F8, \uC774\uC775\uAE08\uBC30\uBD84 \uBA54\uCEE4\uB2C8\uC998\uC758 \uC2E4\uD589\uD589\uC704 \uD574\uB2F9\uC131: \uB099\uCC30 \uD6C4 \uBBF8\uB099\uCC30\uC0AC\uC5D0 \uC774\uC775\uC744 \uBC30\uBD84\uD558\uB294 \uD589\uC704\uAC00 \uD569\uC758\uC758 \uC774\uD589 \uD589\uC704\uB85C \uC778\uC815\uB41C \uC810\uC740, \uD569\uC758\uC640 \uC2E4\uD589\uC758 \uBD84\uB9AC \uAC00\uB2A5\uC131 \uB17C\uC758\uC5D0\uC11C \uC911\uC694\uD55C \uCC38\uC870\uC810\uC774 \uB41C\uB2E4.\n\n\uBE44\uAD50\uBC95\uC801 \uC2DC\uC0AC\uC810\uC73C\uB85C\uB294, EU \uACBD\uC7C1\uBC95\uC0C1 \uC785\uCC30\uB2F4\uD569(bid rigging)\uC5D0 \uB300\uD55C \uBAA9\uC801\uC5D0 \uC758\uD55C \uC81C\uD55C(restriction by object) \uC6D0\uCE59\uACFC\uC758 \uBE44\uAD50\uAC00 \uC720\uD6A8\uD558\uB2E4. EU\uC5D0\uC11C\uB294 \uC785\uCC30\uB2F4\uD569\uC744 \uD6A8\uACFC \uC785\uC99D \uC5C6\uC774 \uC704\uBC18\uC73C\uB85C \uCD94\uC815\uD558\uB294 \uBC18\uBA74, \uD55C\uAD6D \uACF5\uC815\uAC70\uB798\uBC95\uC740 '\uBD80\uB2F9\uD558\uAC8C \uACBD\uC7C1\uC744 \uC81C\uD55C\uD560 \uAC83' \uC694\uAC74\uC744 \uBA85\uC2DC\uD558\uC5EC \uACBD\uC7C1 \uC81C\uD55C \uD6A8\uACFC \uD310\uB2E8\uC774 \uC694\uAD6C\uB41C\uB2E4\uB294 \uC810\uC5D0\uC11C \uC785\uC99D \uBD80\uB2F4\uC758 \uAD6C\uC870\uC801 \uCC28\uC774\uAC00 \uC874\uC7AC\uD558\uBA70, \uC774 \uBE44\uAD50\uB294 \uD6C4\uC18D \uC5F0\uAD6C\uC758 \uD575\uC2EC \uACFC\uC81C\uB85C \uC81C\uC2DC\uB41C\uB2E4. \uD6C4\uC18D \uC5F0\uAD6C\uB85C\uB294 (i) \uBCF8 \uC0AC\uAC74 \uC774\uD6C4 \uAD00\uAE09 \uC785\uCC30\uB2F4\uD569 \uC0AC\uAC74\uC5D0\uC11C\uC758 \uAD6C\uC131\uC694\uAC74 \uD310\uB2E8 \uC77C\uAD00\uC131 \uBD84\uC11D, (ii) \uB099\uCC30\uB960 \uC9C0\uD45C\uC758 \uACBD\uC81C \uC99D\uAC70 \uD65C\uC6A9 \uBC29\uBC95\uB860 \uC815\uAD50\uD654, (iii) \uD55C\uAD6D\xB7EU\xB7\uBBF8\uAD6D\uC758 \uC785\uCC30\uB2F4\uD569 \uADDC\uC81C \uCCB4\uACC4 \uBE44\uAD50\uAC00 \uC81C\uC548\uB41C\uB2E4.",
        "g": "\uC21C\uBC88\uC81C, \uACF5\uB3D9\uC21C\uBC88\uC81C, \uC774\uC775\uAE08\uBC30\uBD84\uC81C \uBC29\uC2DD\uC744 \uD1B5\uD574 \uB2F4\uD569\uC73C\uB85C \uC778\uD55C \uC774\uC775\uC744 \uBC30\uBD84\uD558\uB294 \uBC29\uBC95\uC73C\uB85C \uC785\uCC30\uBB3C\uB7C9\uC744 \uC0C1\uD638 \uBC30\uBD84\uD558\uAE30\uB85C \uD569\uC758\uD558\uACE0 \uC774\uB97C \uC9C0\uC18D\uC801\uC73C\uB85C \uC2E4\uD589\uD558\uC600\uB2E4. | \uD53C\uC2EC\uC778\uB4E4\uC740 \uC0AC\uC804\uC5D0 \uB099\uCC30\uC608\uC815\uC790 \uACB0\uC815\uBC29\uC2DD\uACFC \uC774\uC775\uBC30\uBD84 \uBC29\uC2DD\uC758 \uC6D0\uCE59\uC744 \uACB0\uC815\uD55C \uB2E4\uC74C... \uD569\uC758\uC5D0 \uCC38\uC5EC\uD1A0\uB85D \uD558\uC5EC \uC0AC\uC804\uC5D0 \uB099\uCC30\uC608\uC815\uC790\uC758 \uD22C\uCC30\uAC00\uACA9\uC744 \uACB0\uC815\uD558\uACE0... | \uB3C5\uC810\uADDC\uC81C \uBC0F \uACF5\uC815\uAC70\uB798\uC5D0 \uAD00\uD55C \uBC95\uB960(\uC774\uD558 '\uBC95'\uC774\uB77C \uD55C\uB2E4) \uC81C2\uC870 \uC81C1\uD638\uC5D0\u2026"
      }
    ]
  },
  "coupang": {
    "key": "coupang",
    "title": "\uCFE0\uD321(\uC8FC)\uC758 \uC804\uC790\uC0C1\uAC70\uB798\uC18C\uBE44\uC790\uBCF4\uD638\uBC95 \uB4F1 \uC704\uBC18\uD589\uC704\uC5D0 \uB300\uD55C \uAC74",
    "short": "\uCFE0\uD321 \uC640\uC6B0 \uBA64\uBC84\uC2ED",
    "type": "\uC804\uC790\uC0C1\uAC70\uB798",
    "law": "\uC804\uC790\uC0C1\uAC70\uB798\uBC95",
    "article": "\uC804\uC790\uC0C1\uAC70\uB798\uBC95 \uC81C21\uC870 \uC81C1\uD56D \uC81C1\uD638",
    "source": "\uACF5\uC815\uAC70\uB798\uC704\uC6D0\uD68C \uC758\uACB0\uC11C",
    "facts": {
      "\uB2F9\uC0AC\uC790": "\uCFE0\uD321 \uC8FC\uC2DD\uD68C\uC0AC(\uD53C\uC2EC\uC778); \uC640\uC6B0 \uBA64\uBC84\uC2ED \uAE30\uC874 \uACE0\uAC1D \uC57D 1,160\uB9CC \uBA85(\uD53C\uD574\uC790)",
      "\uAE30\uAC04": "2024.4.16~2024.6.5",
      "\uD589\uC704": "\uBA64\uBC84\uC2ED \uAC00\uACA9 \uC778\uC0C1 \uB3D9\uC758 \uACFC\uC815\uC5D0\uC11C \uB3D9\uC758 \uC720\uBCF4 \uBC84\uD2BC \uCD95\uC18C\xB7\uC740\uD3D0 \uBC0F \uACB0\uC81C \uBC84\uD2BC\uC5D0 \uB3D9\uC758 \uBB38\uAD6C \uBCD1\uAE30 \uB4F1 \uAE30\uB9CC\uC801 \uBC29\uBC95 \uC0AC\uC6A9",
      "\uD53C\uD574\uADDC\uBAA8": "\uACFC\uD0DC\uB8CC 250\uB9CC \uC6D0, \uAC00\uACA9 \uC778\uC0C1 \uB3D9\uC758\uC790 \uC57D 1,160\uB9CC \uBA85",
      "\uD53C\uD574\uBC94\uC704": "\uC640\uC6B0 \uBA64\uBC84\uC2ED \uAE30\uC874 \uACE0\uAC1D \uC57D 1,160\uB9CC \uBA85 [\uC804\uC790\uC0C1\uAC70\uB798]",
      "\uC694\uC57D": "\uCFE0\uD321\uC774 \uC640\uC6B0 \uBA64\uBC84\uC2ED \uC6D4\uD68C\uBE44\uB97C 4,990\uC6D0\uC5D0\uC11C 7,890\uC6D0\uC73C\uB85C \uC62C\uB9AC\uBA74\uC11C \uB3D9\uC758 \uC720\uBCF4 \uBC84\uD2BC\uC744 \uC791\uACE0 \uD750\uB9AC\uAC8C \uD45C\uC2DC\uD558\uACE0 \uACB0\uC81C \uBC84\uD2BC\uC5D0 \uAC00\uACA9 \uC778\uC0C1 \uB3D9\uC758 \uBB38\uAD6C\uB97C \uB07C\uC6CC \uB123\uC5B4 \uC57D 1,160\uB9CC \uBA85\uC774 \uB3D9\uC758\uD588\uB2E4. \uACF5\uC815\uC704\uB294 \uC2DC\uC815\uBA85\uB839\uACFC \uACFC\uD0DC\uB8CC 250\uB9CC \uC6D0\uC744 \uBD80\uACFC\uD588\uB2E4."
    },
    "legal": {
      "\uC138\uBD84\uB958": "\uAE30\uB9CC\uC801 UI \uC870\uC791\uC744 \uD1B5\uD55C \uBA64\uBC84\uC2ED \uAC00\uACA9 \uC778\uC0C1 \uB3D9\uC758 \uC720\uB3C4",
      "\uC704\uBC18\uC870\uBB38": "\uC804\uC790\uC0C1\uAC70\uB798\uBC95 \uC81C21\uC870 \uC81C1\uD56D \uC81C1\uD638",
      "\uC0B0\uC5C5\uBD84\uC57C": "\uC628\uB77C\uC778 \uC1FC\uD551\uBAB0(\uC624\uD508\uB9C8\uCF13) \uBC0F \uAD6C\uB3C5\uACBD\uC81C \uBA64\uBC84\uC2ED \uC11C\uBE44\uC2A4 \uC2DC\uC7A5",
      "\uC804\uC81C1": "\uC804\uC790\uC0C1\uAC70\uB798\uBC95 \uC81C21\uC870 \uC81C1\uD56D \uC81C1\uD638: \uD1B5\uC2E0\uD310\uB9E4\uC5C5\uC790\uB294 \uAE30\uB9CC\uC801 \uBC29\uBC95\uC744 \uC0AC\uC6A9\uD558\uC5EC \uC18C\uBE44\uC790\uB97C \uC720\uC778 \uB610\uB294 \uC18C\uBE44\uC790\uC640 \uAC70\uB798\uD558\uB294 \uD589\uC704\uB97C \uD558\uC5EC\uC11C\uB294 \uC544\uB2C8 \uB41C\uB2E4",
      "\uC804\uC81C2": "\uBCF8 \uC0AC\uAC74\uC740 \u2460 \uB3D9\uC758 \uC720\uBCF4 \uBC84\uD2BC\uC744 \uD31D\uC5C5\uCC3D \uC6B0\uCE21 \uB9E8 \uC0C1\uB2E8\uC5D0 \uBC31\uC0C9\xB7\uC18C\uD615\uC73C\uB85C \uC740\uD3D0\uD558\uACE0 \uC989\uC2DC \uB3D9\uC758 \uBC84\uD2BC\uC744 \uCCAD\uC0C9\xB7\uB300\uD615\uC73C\uB85C \uAC15\uC870\uD558\uB294 \uAE30\uB9CC\uC801 \uBC29\uBC95 \uC0AC\uC6A9, \u2461 \uAE30\uC874 \uACB0\uC81C \uBC84\uD2BC(\uCCAD\uC0C9)\uC5D0 \uAC00\uACA9 \uC778\uC0C1 \uB3D9\uC758 \uBB38\uAD6C\uB97C \uBCD1\uAE30\uD558\uC5EC \uC18C\uBE44\uC790\uAC00 \uC778\uC9C0\uD558\uAE30 \uC5B4\uB835\uAC8C \uC740\uD3D0\uD558\uB294 \uAE30\uB9CC\uC801 \uBC29\uBC95 \uC0AC\uC6A9, \u2462 \uC57D 1,160\uB9CC \uBA85\uC774 \uB3D9\uC758 \uC758\uC0AC\uB97C \uD45C\uC2DC\uD558\uACE0 48,162\uBA85\uC774 \uC0AC\uD6C4 \uB3D9\uC758\uB97C \uCCA0\uD68C\uD558\uB294 \uB4F1 \uC18C\uBE44\uC790 \uC720\uC778\xB7\uAC70\uB798 \uC0AC\uC2E4 \uBC1C\uC0DD \u2014 2\uAC1C \uC694\uAC74 \uBAA8\uB450 \uCDA9\uC871",
      "\uACB0\uB860": "\uC804\uC790\uC0C1\uAC70\uB798\uBC95 \uC81C21\uC870 \uC81C1\uD56D \uC81C1\uD638 (\uAE30\uB9CC\uC801 \uBC29\uBC95\uC744 \uC0AC\uC6A9\uD558\uC5EC \uC18C\uBE44\uC790\uB97C \uC720\uC778 \uB610\uB294 \uAC70\uB798\uD55C \uD589\uC704) \uC704\uBC18"
    },

        "a": "\uACF5\uC815\uAC70\uB798\uC704\uC6D0\uD68C\uAC00 \uCFE0\uD321\uC5D0\uAC8C \uB450 \uAC00\uC9C0 \uCC98\uBC8C\uC744 \uB0B4\uB838\uC5B4\uC694. \uCCAB \uBC88\uC9F8\uB294 \uC2DC\uC815\uBA85\uB839(\uC55E\uC73C\uB85C \uC774\uB7F0 \uD589\uB3D9\uC744 \uD558\uBA74 \uC548 \uB41C\uB2E4\uB294 \uBA85\uB839)\uC774\uACE0, \uB450 \uBC88\uC9F8\uB294 \uACFC\uD0DC\uB8CC(\uBC8C\uAE08 \uAC19\uC740 \uAC70\uC608\uC694) 250\uB9CC \uC6D0\uC774\uC5D0\uC694. \uC55E\uC73C\uB85C \uBA64\uBC84\uC2ED \uAC00\uACA9 \uC62C\uB9B4 \uB54C \uC18C\uBE44\uC790\uB97C \uC18D\uC774\uB294 \uBC29\uC2DD\uC73C\uB85C \uB3D9\uC758\uB97C \uBC1B\uC73C\uBA74 \uC548 \uB41C\uB2E4\uB294 \uAC70\uC608\uC694.",
        "g": "\uACFC\uD0DC\uB8CC: 2,500,000\uC6D0 | \uD53C\uC2EC\uC778\uC740 ... \uAE30\uB9CC\uC801\uC778 \uBC29\uBC95\uC744 \uC0AC\uC6A9\uD558\uC5EC \uC18C\uBE44\uC790\uB97C \uC720\uC778 \uB610\uB294 \uC18C\uBE44\uC790\uC640 \uAC70\uB798\uD558\uB294 \uD589\uC704\uB97C \uB2E4\uC2DC \uD558\uC5EC\uC11C\uB294 \uC544\uB2C8 \uB41C\uB2E4. | \uD53C\uC2EC\uC778\uC740 \uB2E4\uC74C \uAC01 \uD638\uC5D0 \uB530\uB77C \uACFC\uD0DC\uB8CC\uB97C \uAD6D\uACE0\uC5D0 \uB0A9\uBD80\uD558\uC5EC\uC57C \uD55C\uB2E4. \uAC00. \uACFC\uD0DC\uB8CC: 2,500,000\uC6D0 | \uAC00. \uACFC\uD0DC\uB8CC: 2,500,000\uC6D0 | \uB098. \uB0A9\uBD80\uAE30\uD55C: \uACFC\uD0DC\uB8CC \uB0A9\uBD80\uACE0\uC9C0\uC11C\uC5D0 \uBA85\uC2DC\uB41C \uB0A9\uBD80\uAE30\uD55C(60\uC77C) \uC774\uB0B4 | '\uB3D9\uC758 \uC720\uBCF4' \uBC84\uD2BC\uC744\u2026"
      },

        "q": "\uCFE0\uD321\uC774 \uC5B4\uB5A4 \uBC95\uC744 \uC5B4\uAE34 \uAC74\uAC00\uC694?",
        "a": "\uC804\uC790\uC0C1\uAC70\uB798\uBC95(\uC778\uD130\uB137 \uC1FC\uD551\uD560 \uB54C \uC18C\uBE44\uC790\uB97C \uBCF4\uD638\uD558\uB294 \uBC95\uC774\uC5D0\uC694) \uC81C21\uC870\uB97C \uC5B4\uACBC\uC5B4\uC694. \uC27D\uAC8C \uB9D0\uD558\uBA74 \uC18C\uBE44\uC790\uB97C \uC18D\uC774\uB294 \uBC29\uBC95\uC744 \uC368\uC11C \uBB3C\uAC74\uC774\uB098 \uC11C\uBE44\uC2A4\uB97C \uD314\uBA74 \uC548 \uB41C\uB2E4\uB294 \uADDC\uC815\uC778\uB370, \uCFE0\uD321\uC774 \uAC00\uACA9 \uC778\uC0C1 \uB3D9\uC758 \uBC84\uD2BC\uC744 \uC54C\uC544\uBCF4\uAE30 \uC5B4\uB835\uAC8C \uB9CC\uB4E4\uC5B4\uC11C \uC774 \uBC95\uC744 \uC704\uBC18\uD55C \uAC70\uC608\uC694.",
        "g": "\uC804\uC790\uC0C1\uAC70\uB798 \uB4F1\uC5D0\uC11C\uC758 \uC18C\uBE44\uC790\uBCF4\uD638\uC5D0 \uAD00\uD55C \uBC95\uB960 \uC81C21\uC870(\uAE08\uC9C0\uD589\uC704) \u2460 \uC804\uC790\uC0C1\uAC70\uB798\uB97C \uD558\uB294 \uC0AC\uC5C5\uC790 \uB610\uB294 \uD1B5\uC2E0\uD310\uB9E4\uC5C5\uC790\uB294 \uC544\uB798 \uAC01 \uD638\uC758... | \uC81C21\uC870(\uAE08\uC9C0\uD589\uC704) \u2460 ... 1. \uAC70\uC9D3 \uB610\uB294 \uACFC\uC7A5\uB41C \uC0AC\uC2E4\uC744 \uC54C\uB9AC\uAC70\uB098 \uAE30\uB9CC\uC801 \uBC29\uBC95\uC744 \uC0AC\uC6A9\uD558\uC5EC \uC18C\uBE44\uC790\uB97C \uC720\uC778 \uB610\uB294 \uC18C\uBE44\uC790\uC640 \uAC70\uB798\uD558\uAC70\uB098... | \uD53C\uC2EC\uC778\uC758 \uC704 2. \uAC00. 1) \uD589\uC704\uB294 \uBC95 \uC81C21\uC870 \uC81C1\uD56D \uC81C1\uD638\uC5D0 \uC704\uBC18\uB41C\uB2E4. | \uD53C\uC2EC\uC778\uC758 \uC704 2. \uAC00.\u2026"

        "persona": "\uAE30\uC5C5 \uCEF4\uD50C\uB77C\uC774\uC5B8\uC2A4 \uB2F4\uB2F9\uC790",
        "qtype": "\uC720\uC0AC\uC0AC\uB840",
        "diff": "\uC2EC\uD654",
        "q": "\uBCF8 \uC0AC\uAC74\uACFC \uC720\uC0AC\uD55C \uAE30\uB9CC\uC801 UI \uC870\uC791 \uC720\uD615\uC5D0\uC11C \uACF5\uC815\uC704\uAC00 \uC704\uBC18 \uC5EC\uBD80\uB97C \uD310\uB2E8\uD55C \uACF5\uD1B5 \uC694\uC18C\uB294 \uBB34\uC5C7\uC774\uBA70, \uB2F9\uC0AC \uAD6C\uB3C5 \uC11C\uBE44\uC2A4 \uC6B4\uC601\uC5D0\uC11C \uC5B4\uB5BB\uAC8C \uC608\uBC29 \uCCB4\uACC4\uB97C \uAD6C\uCD95\uD574\uC57C \uD569\uB2C8\uAE4C?",
        "a": "\uBCF8 \uC0AC\uAC74\uC5D0\uC11C \uACF5\uC815\uC704\uAC00 \uAE30\uB9CC\uC131\uC744 \uC778\uC815\uD55C \uACF5\uD1B5 \uC694\uC18C\uB294 \u2460 \uC120\uD0DD\uC9C0 \uAC04 \uC2DC\uAC01\uC801 \uBD88\uADE0\uD615(\uD06C\uAE30\xB7\uC0C9\uC0C1\xB7\uC704\uCE58), \u2461 \uAC70\uBD80 \uC635\uC158\uC758 \uC740\uD3D0\xB7\uCD95\uC18C, \u2462 \uC774\uC9C8\uC801 \uD589\uC704(\uACB0\uC81C\uC640 \uAC00\uACA9 \uBCC0\uACBD \uB3D9\uC758)\uC758 \uB3D9\uC77C \uBC84\uD2BC \uBCD1\uAE30\uC785\uB2C8\uB2E4. \uC804\uC790\uC0C1\uAC70\uB798 \uAE30\uB9CC\uC801 \uC18C\uBE44\uC790 \uC720\uC778 \uC720\uD615\uC5D0\uC11C \uACF5\uD1B5\uC801\uC73C\uB85C \uB098\uD0C0\uB098\uB294 \uD328\uD134\uC774\uBA70, \uB2E4\uD06C \uD328\uD134 \uC804\uBC18\uC5D0 \uB3D9\uC77C\uD55C \uD310\uB2E8 \uAE30\uC900\uC774 \uC801\uC6A9\uB429\uB2C8\uB2E4. \uB2F9\uC0AC \uC608\uBC29 \uCCB4\uACC4 \uAD6C\uCD95 \uD3EC\uC778\uD2B8\uB294 \uB450 \uAC00\uC9C0\uC785\uB2C8\uB2E4. \uCCAB\uC9F8, \uAD6C\uB3C5 \uC11C\uBE44\uC2A4 \uAC00\uACA9\xB7\uC870\uAC74 \uBCC0\uACBD \uC2DC \uB3D9\uC758 UI \uC124\uACC4\uB97C \uBCC4\uB3C4 \uCEF4\uD50C\uB77C\uC774\uC5B8\uC2A4 \uC2B9\uC778 \uB2E8\uACC4\uB85C \uBD84\uB9AC\uD558\uACE0, \uAC70\uBD80 \uC635\uC158\uC758 \uB3D9\uB4F1 \uB178\uCD9C \uC5EC\uBD80\uB97C \uBC95\uBB34\uD300\uC774 \uC11C\uBA74 \uD655\uC778\uD558\uB294 \uD504\uB85C\uC138\uC2A4\uB97C \uB0B4\uBD80\uD1B5\uC81C\uC5D0 \uBC18\uC601\uD569\uB2C8\uB2E4. \uB458\uC9F8, \uACB0\uC81C \uD50C\uB85C\uC6B0\uC640 \uACC4\uC57D \uC870\uAC74 \uBCC0\uACBD \uB3D9\uC758\uB294 \uBC18\uB4DC\uC2DC \uD654\uBA74\uC744 \uBD84\uB9AC\uD558\uB294 \uC124\uACC4 \uC6D0\uCE59\uC744 \uB9E4\uB274\uC5BC\uC5D0 \uBA85\uC2DC\uD569\uB2C8\uB2E4.",
        "g": "'\uB3D9\uC758 \uC720\uBCF4' \uBC84\uD2BC\uC744 '\uC989\uC2DC \uB3D9\uC758' \uBC84\uD2BC\uC5D0 \uBE44\uD574 \uD604\uACA9\uD558\uAC8C \uC791\uAC8C \uD45C\uC2DC\uD558\uACE0 \uADF8 \uC0C9\uC0C1\uB3C4 \uB208\uC5D0 \uB744\uC9C0 \uC54A\uB294 \uBC31\uC0C9\uC73C\uB85C \uCC98\uB9AC\uD55C \uB370 \uB098\uC544\uAC00 \uADF8 \uC704\uCE58\uB3C4 \uD31D\uC5C5\uCC3D \uC6B0\uCE21 \uB9E8 \uC0C1\uB2E8\uC5D0 \uBC30\uCE58... | \uAE30\uC874 \uACE0\uAC1D\uB4E4\uC774 \uC778\uC9C0\uD558\uAE30 \uC5B4\uB835\uAC8C \uC740\uD3D0\uD558\uACE0 \uADF8 \uB0B4\uC6A9\uC744 \uD45C\uC2DC\uD558\uB294 \uBB38\uAD6C\uC758 \uD06C\uAE30\uB3C4 \uCD95\uC18C\uD558\uB294 \uBC29\uBC95\uC744 \uC0AC\uC6A9\uD55C \uD589\uC704\uC5D0 \uD574\uB2F9\uD55C\uB2E4\uACE0 \uD310\uB2E8\uB41C\uB2E4. | '\uB3D9\uC758 \uC720\uBCF4' \uBC84\uD2BC\uC744 \uD604\uACA9\uD558\uAC8C \uC791\uAC8C \uD45C\uC2DC\uD558\uACE0 \uC0C9\uC0C1\uB3C4 \uB208\uC5D0 \uB744\uC9C0 \uC54A\uB294 \uBC31\uC0C9\uC73C\u2026"

        "a": "\uC758\uACB0\uC11C\uC5D0 \uACF5\uAC1C\uB41C \uACBD\uB85C\uBCC4 \uB3D9\uC758 \uC218\uCE58\uB294 \uCD5C\uCD08 \uC811\uC18D \uD31D\uC5C5 6,241,850\uBA85 / \uC7A5\uBC14\uAD6C\uB2C8 \uACB0\uC81C \uBC84\uD2BC 3,172,162\uBA85 / 1-Click \uAD6C\uB9E4 \uBC84\uD2BC 2,188,375\uBA85 / \uD569\uACC4 11,602,387\uBA85\uC785\uB2C8\uB2E4(\uCFE0\uD321_039). \uC0AC\uD6C4 \uB3D9\uC758 \uCCA0\uD68C\uC790\uB294 48,162\uBA85\uC785\uB2C8\uB2E4(\uCFE0\uD321_038). \uB2F9\uC0AC \uB9AC\uC2A4\uD06C \uADDC\uBAA8 \uCD94\uC815 \uC2DC \uD65C\uC6A9 \uD3EC\uC778\uD2B8\uB294 \uB450 \uAC00\uC9C0\uC785\uB2C8\uB2E4. \uCCAB\uC9F8, \uACB0\uC81C \uBC84\uD2BC \uACBD\uB85C(\uC7A5\uBC14\uAD6C\uB2C8+1-Click \uD569\uACC4 \uC57D 536\uB9CC \uBA85, \uC804\uCCB4\uC758 \u7D0446%)\uAC00 \uC0C1\uB2F9 \uBE44\uC911\uC744 \uCC28\uC9C0\uD55C \uC810\uC740 \uACB0\uC81C \uD50C\uB85C\uC6B0 \uB0B4 \uB3D9\uC758 UI\uAC00 \uB9AC\uC2A4\uD06C \uC9D1\uC911 \uC9C0\uC810\uC784\uC744 \uC2DC\uC0AC\uD558\uBA70, \uB2F9\uC0AC \uACB0\uC81C \uD50C\uB85C\uC6B0\uB97C \uC6B0\uC120 \uC810\uAC80 \uB300\uC0C1\uC73C\uB85C \uC124\uC815\uD574\uC57C \uD569\uB2C8\uB2E4. \uB458\uC9F8, \uC0AC\uD6C4 \uCCA0\uD68C\uC728 \uC57D 0.4%\uB294 \uC18C\uBE44\uC790 \uC778\uC9C0\uB3C4\uAC00 \uB0AE\uC558\uC74C\uC744 \uB098\uD0C0\uB0B4\uBBC0\uB85C, \uC774 \uC218\uCE58\uAC00 \uBD84\uC7C1\xB7\uBBFC\uC6D0 \uADDC\uBAA8 \uCD94\uC815\uC758 \uD558\uD55C\uC120\uC73C\uB85C \uD65C\uC6A9 \uAC00\uB2A5\uD569\uB2C8\uB2E4. \uB2F9\uC0AC MAU\xB7\uAD6C\uB3C5\uC790 \uC218\uC5D0 \uB3D9\uC77C \uBE44\uC728\uC744 \uC801\uC6A9\uD558\uC5EC \uC7A0\uC7AC \uB9AC\uC2A4\uD06C \uC778\uC6D0\uC744 \uC0AC\uC804 \uCD94\uC815\uD558\uB294 \uB0B4\uBD80 \uC2DC\uBBAC\uB808\uC774\uC158\uC744 \uAD8C\uC7A5\uD569\uB2C8\uB2E4.",
        "g": "\uCD5C\uCD08 \uC811\uC18D \uB2E8\uACC4 \uACFC\uC815 6,241,850 / \uC7A5\uBC14\uAD6C\uB2C8 \uAD6C\uB9E4 \uACFC\uC815 3,172,162 / 1-Click \uAD6C\uB9E4 \uACFC\uC815 2,188,375 / \uD569\uACC4 11,602,387 | \uD53C\uC2EC\uC778\uC740 \uC790\uC2E0\uC774 \uC6B4\uC601\uD558\uB294 \uC0AC\uC774\uBC84\uBAB0\uC5D0\uC11C \uC7AC\uD654 \uB4F1\uC758 \uD310\uB9E4\uC5D0 \uAD00\uD55C \uC815\uBCF4\uB97C \uC81C\uACF5\uD558\uACE0 \uC18C\uBE44\uC790\uC758 \uCCAD\uC57D\uC744 \uBC1B\uC544 \uC7AC\uD654 \uB4F1\uC744 \uD310\uB9E4\uD558\uB294 \uAC83\uC744 \uC5C5\uC73C\uB85C \uD558\uB294 \uC790... | ...\uAE30\uC874 \uACE0\uAC1D\uB4E4 \uC911 \uC57D 1,160\uB9CC \uBA8522)\uC774 2024. 4. 16\u2026"

      {
        "ID": "045",
        "persona": "\uB17C\uBB38 \uC900\uBE44 \uD559\uC0DD",
        "qtype": "\uC2DC\uC7A5\uC601\uD5A5",
        "diff": "\uC804\uBB38\uAC00",
        "q": "\uBCF8 \uC0AC\uAC74\uC758 \uCC98\uBD84\uC774 \uAD6D\uB0B4 \uC628\uB77C\uC778 \uC1FC\uD551\xB7\uAD6C\uB3C5\uACBD\uC81C \uBA64\uBC84\uC2ED \uC2DC\uC7A5\uC5D0 \uBBF8\uCE5C \uC0B0\uC5C5\uC801\xB7\uC815\uCC45\uC801 \uD568\uC758\uC640 \uBE44\uAD50\uBC95\uC801 \uC2DC\uC0AC\uC810, \uADF8\uB9AC\uACE0 \uD6C4\uC18D \uC5F0\uAD6C \uACFC\uC81C\uB294 \uC5B4\uB5BB\uAC8C \uC815\uB9AC\uB420 \uC218 \uC788\uB294\uAC00?",
        "a": "\uBCF8 \uC0AC\uAC74\uC740 \uAD6D\uB0B4 \uC628\uB77C\uC778 \uC1FC\uD551 \uC2DC\uC7A5(2022\uB144 \uAE30\uC900 150.4\uC870 \uC6D0, \uC624\uD508\uB9C8\uCF13 82.6\uC870 \uC6D0)\uC5D0\uC11C \uAD6C\uB3C5\uACBD\uC81C \uC11C\uBE44\uC2A4\uC758 \uAC00\uACA9 \uC778\uC0C1 \uB3D9\uC758 UI \uC870\uC791 \uD589\uC704\uC5D0 \uB300\uD55C \uACF5\uC815\uC704\uC758 \uCD5C\uCD08 \uC8FC\uC694 \uC81C\uC7AC \uC0AC\uB840\uB85C \uBD84\uC11D\uB41C\uB2E4. \uC0B0\uC5C5\uC801\xB7\uC815\uCC45\uC801 \uD568\uC758\uB294 \uB2E4\uC74C \uC138 \uCE21\uBA74\uC5D0\uC11C \uAC80\uD1A0\uB420 \uC218 \uC788\uB2E4. \uCCAB\uC9F8, \uAD6C\uB3C5\uACBD\uC81C \uC11C\uBE44\uC2A4\uC758 \uAC00\uACA9 \uACB0\uC815 \uACFC\uC815\uC5D0\uC11C \uC18C\uBE44\uC790 \uB3D9\uC758 \uC808\uCC28\uC758 \uD22C\uBA85\uC131 \uC694\uAC74\uC774 \uC804\uC790\uC0C1\uAC70\uB798\uBC95 \uC81C21\uC870 \uC81C1\uD56D \uC81C1\uD638\uB97C \uD1B5\uD574 \uAD6C\uCCB4\uD654\uB418\uC5C8\uB2E4\uB294 \uC810\uC5D0\uC11C \uC0B0\uC5C5 \uD45C\uC900 \uC124\uC815 \uD6A8\uACFC\uAC00 \uC778\uC815\uB41C\uB2E4. \uAE30\uC874 \uC18C\uBE44\uC790\uBCF4\uD638\uBC95 \uCCB4\uACC4\uAC00 \uBA85\uC2DC\uC801 \uD5C8\uC704 \uD45C\uC2DC\uC5D0 \uC9D1\uC911\uD588\uB358 \uB370 \uBE44\uD574, \uBCF8 \uC0AC\uAC74\uC740 UI \uC124\uACC4\uC758 \uAD6C\uC870\uC801 \uBE44\uB300\uCE6D\uC131\uB9CC\uC73C\uB85C\uB3C4 \uC704\uBC18\uC774 \uC131\uB9BD\uD568\uC744 \uD655\uC778\uD55C \uC120\uB840\uB85C \uD3C9\uAC00\uB41C\uB2E4. \uB458\uC9F8, \uCC98\uBD84 \uC218\uC900(\uACFC\uD0DC\uB8CC 250\uB9CC \uC6D0)\uC758 \uC5B5\uC81C\uB825 \uACB0\uD54D\uC740 \uB300\uADDC\uBAA8 \uD50C\uB7AB\uD3FC \uC0AC\uC5C5\uC790\uC5D0 \uB300\uD55C \uADDC\uC81C \uC2E4\uD6A8\uC131 \uBB38\uC81C\uB97C \uC81C\uAE30\uD55C\uB2E4. EU\uC758 GDPR \uACFC\uC9D5\uAE08 \uCCB4\uACC4(\uC5F0\uAC04 \uB9E4\uCD9C\uC561\uC758 \uCD5C\uB300 4%) \uBC0F DSA(Digital Services Act) \uB2E4\uD06C \uD328\uD134 \uADDC\uC81C\uC640 \uBE44\uAD50\uD560 \uB54C, \uAD6D\uB0B4 \uC804\uC790\uC0C1\uAC70\uB798\uBC95\uC758 \uACFC\uD0DC\uB8CC \uC0C1\uD55C \uAD6C\uC870\uB294 \uB300\uD615 \uD50C\uB7AB\uD3FC\uC5D0 \uB300\uD55C \uC5B5\uC81C\uB825\uC774 \uD604\uC800\uD788 \uB0AE\uC740 \uAC83\uC73C\uB85C \uD3C9\uAC00\uB41C\uB2E4. \uC14B\uC9F8, \uAD6C\uB3C5\uACBD\uC81C \uC2DC\uC7A5\uC758 \uC131\uC7A5 \uBC0F \uD50C\uB7AB\uD3FC \uC9D1\uC911\uD654 \uCD94\uC138(\uCFE0\uD321 \uC640\uC6B0 \uBA64\uBC84\uC2ED \uAC00\uC785\uC790 \uADDC\uBAA8)\uB97C \uACE0\uB824\uD560 \uB54C, \uBA64\uBC84\uC2ED \uAC00\uACA9 \uC778\uC0C1 \uB3D9\uC758 \uC808\uCC28\uC5D0 \uB300\uD55C \uC0AC\uC804 \uADDC\uC81C \uAE30\uC900(\uACE0\uC9C0 \uBC29\uC2DD\xB7\uB3D9\uC758 \uD654\uBA74 \uCD5C\uC18C \uC694\uAC74 \uB4F1) \uBC95\uC81C\uD654 \uD544\uC694\uC131\uC774 \uC2DC\uC0AC\uB41C\uB2E4. \uD6C4\uC18D \uC5F0\uAD6C \uACFC\uC81C\uB85C\uB294 (i) \uBCF8 \uC0AC\uAC74 \uC774\uD6C4 \uAD6C\uB3C5\uACBD\uC81C \uC11C\uBE44\uC2A4 \uAC00\uACA9 \uC778\uC0C1 \uB3D9\uC758 \uAD00\uD589 \uBCC0\uD654\uC5D0 \uB300\uD55C \uC2E4\uC99D \uCD94\uC801 \uC5F0\uAD6C, (ii) \uC804\uC790\uC0C1\uAC70\uB798\uBC95 \uAC1C\uC815\uC744 \uD1B5\uD55C \uB2E4\uD06C \uD328\uD134 \uC720\uD615\uD654\xB7\uB9E4\uCD9C\uC561 \uC5F0\uB3D9 \uACFC\uC9D5\uAE08 \uB3C4\uC785 \uD0C0\uB2F9\uC131 \uBE44\uAD50\uBC95\uC801 \uBD84\uC11D, (iii) \uC18C\uBE44\uC790 \uC815\uBCF4\uCC98\uB9AC \uD3B8\uD5A5\uACFC UI \uAE30\uB9CC\uC131 \uAC04 \uC778\uACFC\uAD00\uACC4\uB97C \uADDC\uBA85\uD558\uB294 \uD589\uB3D9\uACBD\uC81C\uD559\uC801 \uC2E4\uD5D8 \uC5F0\uAD6C\uAC00 \uC81C\uC2DC\uB41C\uB2E4.",
        "g": "\uAD6D\uB0B4 \uC628\uB77C\uC778 \uC1FC\uD551 \uC2DC\uC7A55) \uADDC\uBAA8\uB294 2022\uB144 \uAE30\uC900 150.4\uC870\uC6D0(\uAC70\uB798\uAE08\uC561 \uAE30\uC900)\uC774\uACE0, \uC774 \uC911 \uC624\uD508\uB9C8\uCF13 \uC2DC\uC7A5 \uADDC\uBAA8\uB294 82.6\uC870 \uC6D0... | \uD53C\uC2EC\uC778\uC740 \uC790\uC2E0\uC774 \uC6B4\uC601\uD558\uB294 \uC0AC\uC774\uBC84\uBAB0\uC5D0\uC11C \uC7AC\uD654 \uB4F1\uC758 \uD310\uB9E4\uC5D0 \uAD00\uD55C \uC815\uBCF4\uB97C \uC81C\uACF5\uD558\uACE0 \uC18C\uBE44\uC790\uC758 \uCCAD\uC57D\uC744 \uBC1B\uC544 \uC7AC\uD654 \uB4F1\uC744 \uD310\uB9E4\uD558\uB294 \uAC83\uC744 \uC5C5\uC73C\uB85C \uD558\uB294 \uC790... | ...\uAE30\uC874 \uACE0\uAC1D\uB4E4 \uC911 \uC57D 1,160\uB9CC \uBA8522)\uC774 2024. 4. 16.\uBD80\uD130 2024. 6.\u2026"
